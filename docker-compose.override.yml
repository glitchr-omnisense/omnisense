  # ── Mailer (MailDev) — dev only, https://<host>/admin/_/mailer/ ──

  mailer:
    profiles: [mailer]
    container_name: ${APP_NAME:-${COMPOSE_PROJECT_NAME}}-mailer
    user: root
    restart: unless-stopped
    image: maildev/maildev
    volumes:
      - mailer:/mnt/maildev:rw
    environment:
      - MAILDEV_MAIL_DIRECTORY=/mnt/maildev
    command: bin/maildev --web 1080 --smtp 1025 --hide-extensions STARTTLS
    networks:
      - intranet
