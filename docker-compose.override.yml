      - ../omnibase:/srv/omnibase:ro
      # The repositories the catalogue and the manuals are read from
      # (app:packages:sync, wikidoc): every family and library, read only.
      - ../omnibase:/srv/repos/omnibase:ro
      - ../omnibus:/srv/repos/omnibus:ro
      - ../omnitrade:/srv/repos/omnitrade:ro
      - ../omnistate:/srv/repos/omnistate:ro
      - ../omnibank:/srv/repos/omnibank:ro
      - ../omnisong:/srv/repos/omnisong:ro
      - ../omnipost:/srv/repos/omnipost:ro
      - ../omnifood:/srv/repos/omnifood:ro
      - ../omnischolar:/srv/repos/omnischolar:ro
      - ../omnilab:/srv/repos/omnilab:ro
      - ../omnilex:/srv/repos/omnilex:ro
      - ../omnimeet:/srv/repos/omnimeet:ro
      - ../omnishield:/srv/repos/omnishield:ro
      - ../omnisign:/srv/repos/omnisign:ro
      - ../omnibill:/srv/repos/omnibill:ro
      - ../omnireview:/srv/repos/omnireview:ro
      - ../omnibridge:/srv/repos/omnibridge:ro
      - ../flowjs:/srv/repos/flowjs:ro
      - ../graphjs:/srv/repos/graphjs:ro
      # "Used by": the composer.json of each site, and nothing else of it.
      - ../chapaland-v2/composer.json:/srv/sites/chapaland-v2/composer.json:ro
      - ../latoucheoriginale/composer.json:/srv/sites/latoucheoriginale/composer.json:ro
      - ../nakaya-gourmet/composer.json:/srv/sites/nakaya-gourmet/composer.json:ro
      - ../glitchr/composer.json:/srv/sites/glitchr/composer.json:ro
      - ../meyers/composer.json:/srv/sites/meyers/composer.json:ro
      - ../apfelschule/composer.json:/srv/sites/apfelschule/composer.json:ro
      - ../anaelletourret/composer.json:/srv/sites/anaelletourret/composer.json:ro
      - ../brieucvourch/composer.json:/srv/sites/brieucvourch/composer.json:ro
      - ../nakatani/composer.json:/srv/sites/nakatani/composer.json:ro
      - ../monica/composer.json:/srv/sites/monica/composer.json:ro
      - ../wineseller/composer.json:/srv/sites/wineseller/composer.json:ro
      - ../wedding/composer.json:/srv/sites/wedding/composer.json:ro
      - ../maisondesante/composer.json:/srv/sites/maisondesante/composer.json:ro
      - ../nakaya-restaurant/composer.json:/srv/sites/nakaya-restaurant/composer.json:ro
      - ../notaire/composer.json:/srv/sites/notaire/composer.json:ro
      - ../avocat/composer.json:/srv/sites/avocat/composer.json:ro
      - ../juriste/composer.json:/srv/sites/juriste/composer.json:ro
      - ../youtube/composer.json:/srv/sites/youtube/composer.json:ro
      - ../panoboutique/composer.json:/srv/sites/panoboutique/composer.json:ro
      - public:/srv/app/public:rw
      - ./public/assets:/srv/app/public/assets:ro
      - storage:/srv/app/var/storage:rw
      - ./deployments/docker/web/php.ini:/usr/local/etc/php/php.ini

  cron:
    profiles: [cron]
    environment:
      PHP_OPCACHE: "0"
    volumes:
      - .:/srv/app:ro
      - ./var:/srv/app/var:rw
      - ./vendor:/srv/app/vendor:rw
      # The packages built beside this site (omnibase/blog, consent, docs):
      # composer path repositories, ../ from /srv/app, read only.
      - ../omnibase:/srv/omnibase:ro
      # The repositories the catalogue and the manuals are read from
      # (app:packages:sync, wikidoc): every family and library, read only.
      - ../omnibase:/srv/repos/omnibase:ro
      - ../omnibus:/srv/repos/omnibus:ro
      - ../omnitrade:/srv/repos/omnitrade:ro
      - ../omnistate:/srv/repos/omnistate:ro
      - ../omnibank:/srv/repos/omnibank:ro
      - ../omnisong:/srv/repos/omnisong:ro
      - ../omnipost:/srv/repos/omnipost:ro
      - ../omnifood:/srv/repos/omnifood:ro
      - ../omnischolar:/srv/repos/omnischolar:ro
      - ../omnilab:/srv/repos/omnilab:ro
      - ../omnilex:/srv/repos/omnilex:ro
      - ../omnimeet:/srv/repos/omnimeet:ro
      - ../omnishield:/srv/repos/omnishield:ro
      - ../omnisign:/srv/repos/omnisign:ro
      - ../omnibill:/srv/repos/omnibill:ro
      - ../omnireview:/srv/repos/omnireview:ro
      - ../omnibridge:/srv/repos/omnibridge:ro
      - ../flowjs:/srv/repos/flowjs:ro
      - ../graphjs:/srv/repos/graphjs:ro
      # "Used by": the composer.json of each site, and nothing else of it.
      - ../chapaland-v2/composer.json:/srv/sites/chapaland-v2/composer.json:ro
      - ../latoucheoriginale/composer.json:/srv/sites/latoucheoriginale/composer.json:ro
      - ../nakaya-gourmet/composer.json:/srv/sites/nakaya-gourmet/composer.json:ro
      - ../glitchr/composer.json:/srv/sites/glitchr/composer.json:ro
      - ../meyers/composer.json:/srv/sites/meyers/composer.json:ro
      - ../apfelschule/composer.json:/srv/sites/apfelschule/composer.json:ro
      - ../anaelletourret/composer.json:/srv/sites/anaelletourret/composer.json:ro
      - ../brieucvourch/composer.json:/srv/sites/brieucvourch/composer.json:ro
      - ../nakatani/composer.json:/srv/sites/nakatani/composer.json:ro
      - ../monica/composer.json:/srv/sites/monica/composer.json:ro
      - ../wineseller/composer.json:/srv/sites/wineseller/composer.json:ro
