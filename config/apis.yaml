        capabilities: [releases]
        help_wanted: true
      omnisong/podcastindex:
        name: Podcast Index
        status: wanted
        capabilities: [podcasts]
        help_wanted: true
  omnishield:
    status: available
    phrase: { en: 'Guard a form: captcha, spam, addresses known for abuse.', fr: 'Garder un formulaire : captcha, spam, adresses connues pour abus.' }
    capabilities: [captcha, spam, reputation, link-safety]
  omnisearch:
    status: available
    phrase: { en: 'Search, whatever the engine.', fr: 'Chercher, quel que soit le moteur.' }
    capabilities: [indexing, search]
    help_wanted: true
    providers:
      omnisearch/meilisearch:
        name: Meilisearch
        status: wanted
        capabilities: [indexing, search]
        help_wanted: true
      omnisearch/elasticsearch:
        name: Elasticsearch / OpenSearch
        status: wanted
        capabilities: [indexing, search]
        help_wanted: true
  omniauth:
    status: available
    phrase: { en: 'Sign people in, by whichever factors.', fr: 'Faire entrer les gens, par les facteurs voulus.' }
    capabilities: [sign-in, one-time-codes, passkeys]
  omnidocs:
    status: available
    phrase: { en: 'One model of a manual, whatever wrote it.', fr: 'Un modèle de manuel, quel que soit l’outil qui l’a écrit.' }
    capabilities: [manuals]
  omnitravel:
    status: available
    phrase: { en: 'Read timetables, journeys and real time, by train, plane or city transit.', fr: 'Lire horaires, itinéraires et temps réel, en train, en avion ou en transports urbains.' }
    capabilities: [timetables, journeys, real-time]
    providers:
      omnitravel/gtfs: { name: GTFS and GTFS-Realtime, status: available, capabilities: [timetables, real-time] }
