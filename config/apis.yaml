families:
  omnibus:
    status: available
    phrase: { en: 'Ship a parcel, whatever the carrier.', fr: 'Expédier un colis, quel que soit le transporteur.' }
    capabilities: [rates, labels, tracking, pickup-points]
  omnitrade:
    status: available
    phrase: { en: 'Take payments and sell, whatever the provider.', fr: 'Encaisser et vendre, quel que soit le prestataire.' }
    capabilities: [payments, refunds, subscriptions, products]
  omnibank:
    status: available
    phrase: { en: 'Read a bank account.', fr: 'Lire un compte bancaire.' }
    capabilities: [accounts, transactions]
  omnistate:
    status: available
    phrase: { en: 'Ask the public registers what they know.', fr: 'Demander aux registres publics ce qu’ils savent.' }
    capabilities: [companies, vat, domains, civil-records, health-professionals, statistics, trademarks]
    providers:
      omnistate/insee: { name: INSEE (BDM, SDMX), capabilities: [statistics], status: available }
      omnistate/eurostat: { name: Eurostat, capabilities: [statistics], status: available }
      omnistate/ecb: { name: ECB Data Portal, capabilities: [statistics], status: available }
  omnilab:
    status: available
    phrase: { en: 'Read what science knows of a thing, or measures at a place.', fr: 'Lire ce que la science sait d’une chose, ou mesure en un lieu.' }
    capabilities: [entities, series, weather, occurrences]
    help_wanted: true
    providers:
      omnilab/openweathermap:
        name: OpenWeather
        status: wanted
        capabilities: [weather, series]
        help_wanted: true
        policy:
          auth: key
          commercial: yes
          attribution: required
          credit: 'Weather data provided by OpenWeather'
          note: { en: '60 calls a minute, 1,000,000 a month on the free plan; the credit links to openweathermap.org.', fr: '60 appels par minute, 1 000 000 par mois en offre gratuite ; le crédit renvoie à openweathermap.org.' }
          terms: 'https://openweathermap.org/price'
          read: '2026-11-10'
      omnilab/met-norway:
        name: MET Norway (api.met.no)
        status: wanted
        capabilities: [weather, series]
        help_wanted: true
        policy:
          auth: none
          commercial: yes
          attribution: required
          credit: 'Data from MET Norway'
          note: { en: 'CC BY 4.0; an identifying User-Agent is mandatory, under 20 requests a second, coordinates to 4 decimals.', fr: 'CC BY 4.0 ; un User-Agent identifiant est obligatoire, moins de 20 requêtes par seconde, coordonnées à 4 décimales.' }
          terms: 'https://api.met.no/doc/TermsOfService'
          read: '2026-11-10'
      omnilab/meteo-france:
        name: Météo-France
        status: wanted
        capabilities: [weather, series]
        help_wanted: true
        policy:
          auth: key
          commercial: yes
          attribution: required
          note: { en: 'Licence Ouverte 2.0; an account on the API portal; about 100 requests a minute per API.', fr: 'Licence Ouverte 2.0 ; un compte sur le portail des API ; environ 100 requêtes par minute et par API.' }
          terms: 'https://portail-api.meteofrance.fr/'
          read: '2026-11-10'
  omnilex:
    status: available
    phrase: { en: 'Read the sources of law.', fr: 'Lire les sources du droit.' }
    capabilities: [law-texts, case-law]
  omnischolar:
    status: available
    phrase: { en: 'Gather a researcher’s publications.', fr: 'Rassembler les publications d’un chercheur.' }
    capabilities: [works, authors, books, datasets]
  omnisign:
    status: available
    phrase: { en: 'Have a document signed, and check who signs it.', fr: 'Faire signer un document, et vérifier qui le signe.' }
    capabilities: [signature, identity-check, tenant-file]
    released_capabilities: [signature]
    help_wanted: true
    note: { en: 'Identity verification joined the family on 2026-11-10 (no separate omniproof): Stripe Identity and DossierFacile released as 1.x-dev, Veriff and Entrust reserved.', fr: 'La vérification d’identité a rejoint la famille le 2026-11-10 (pas d’omniproof à part) : Stripe Identity et DossierFacile publiés en 1.x-dev, Veriff et Entrust réservés.' }
    providers:
      omnisign/stripe-identity: { name: Stripe Identity, capabilities: [identity-check], status: available }
      omnisign/veriff:
        name: Veriff
        status: reserved
        capabilities: [identity-check]
        help_wanted: true
        policy:
          auth: key
          commercial: yes
          attribution: unclear
          note: { en: 'A 15-day trial, then billed per verification with a monthly minimum.', fr: 'Un essai de 15 jours, puis facturé à la vérification avec un minimum mensuel.' }
          terms: 'https://www.veriff.com/pricing'
          read: '2026-11-10'
      omnisign/entrust:
        name: Entrust Identity Verification (Onfido)
        status: reserved
        capabilities: [identity-check]
        help_wanted: true
        policy:
          auth: contract
          commercial: yes
          attribution: unclear
          note: { en: 'Onfido is now Entrust; a sandbox, live use under contract.', fr: 'Onfido s’appelle désormais Entrust ; un bac à sable, l’usage réel sous contrat.' }
          terms: 'https://documentation.identity.entrust.com/getting-started/quick-start-guide/'
          read: '2026-11-10'
      omnisign/dossierfacile: { name: DossierFacile, capabilities: [tenant-file], access: oauth, status: available }
  omnibill:
    status: available
    phrase: { en: 'E-invoices and accounting: send and receive an invoice, hand the books to the accountant’s software.', fr: 'Factures électroniques et comptabilité : émettre et recevoir une facture, transmettre les comptes au logiciel de l’expert-comptable.' }
    capabilities: [invoices, journal-entries, contacts]
    released_capabilities: [invoices]
    help_wanted: true
    note: { en: 'French accounting software often doubles as an approved e-invoicing platform (PDP): one provider can answer both. Odoo and Pennylane released as 1.x-dev, Xero and QuickBooks reserved.', fr: 'Les logiciels comptables français sont souvent aussi plateformes de dématérialisation partenaires (PDP) : un même fournisseur peut répondre aux deux. Odoo et Pennylane publiés en 1.x-dev, Xero et QuickBooks réservés.' }
    providers:
      omnibill/pennylane: { name: Pennylane, capabilities: [journal-entries, invoices, contacts], access: oauth, status: available }
      omnibill/xero:
        name: Xero
        status: reserved
        capabilities: [journal-entries, invoices, contacts]
        help_wanted: true
        policy:
          auth: oauth
          commercial: yes
          attribution: none
          note: { en: 'Free up to 5 connections; certification above; no AI training on API data.', fr: 'Gratuit jusqu’à 5 connexions ; certification au-delà ; pas d’entraînement d’IA sur les données.' }
          terms: 'https://developer.xero.com/xero-developer-platform-terms-conditions'
          read: '2026-11-10'
      omnibill/quickbooks:
        name: QuickBooks Online
        status: reserved
        capabilities: [journal-entries, invoices, contacts]
        help_wanted: true
        policy:
          auth: oauth
          commercial: yes
          attribution: unclear
          note: { en: 'Production keys only after Intuit’s app assessment.', fr: 'Clés de production seulement après l’évaluation de l’app par Intuit.' }
          terms: 'https://developer.intuit.com/app/developer/qbo/docs/learn/limits-and-throttles'
          read: '2026-11-10'
      omnibill/odoo: { name: Odoo, capabilities: [journal-entries, invoices, contacts], status: available }
  omniticket:
    status: available
    phrase: { en: 'Read the tickets sold elsewhere.', fr: 'Lire les billets vendus ailleurs.' }
    capabilities: [events, tickets]
    providers:
      omniticket/eventbrite: { name: Eventbrite, access: oauth, status: available }
  omnimeet:
    status: available
    phrase: { en: 'Open a video room and let someone in.', fr: 'Ouvrir une salle de visio et y faire entrer.' }
    capabilities: [rooms]
  omnipulse:
    status: available
    phrase: { en: 'Audience, reviews and funding: the pulse of a site or project.', fr: 'Audience, avis et financement : le pouls d’un site ou d’un projet.' }
    capabilities: [audience, search-queries, reviews, sponsors]
    note: { en: 'Named by Marco on 2026-11-10; its providers are published as omnipulse/<name> (omnireview/google is omnipulse/google-reviews).', fr: 'Nommée par Marco le 2026-11-10 ; ses fournisseurs sont publiés sous omnipulse/<nom> (omnireview/google est omnipulse/google-reviews).' }
    merged:
      omnireach: [audience, search-queries]
      omnireview: [reviews]
      omnifund: [sponsors]
    providers:
      omnipulse/search-console: { access: oauth, status: available, capabilities: [search-queries] }
      omnipulse/bing-webmaster: { status: available, capabilities: [search-queries] }
      omnipulse/matomo: { status: available, capabilities: [audience] }
      omnipulse/plausible: { status: available, capabilities: [audience] }
      omnipulse/ga4: { access: oauth, status: available, capabilities: [audience] }
      omnipulse/google-reviews: { access: oauth, status: available, capabilities: [reviews] }
      omnipulse/tripadvisor: { status: available, capabilities: [reviews] }
      omnipulse/trustpilot: { status: available, capabilities: [reviews] }
      omnipulse/github-sponsors: { status: available, capabilities: [sponsors] }
      omnipulse/opencollective: { status: available, capabilities: [sponsors] }
      omnipulse/liberapay: { status: available, capabilities: [sponsors] }
  omnidns:
    status: available
    phrase: { en: 'Manage a domain name where it is registered.', fr: 'Gérer un nom de domaine là où il est enregistré.' }
    capabilities: [registration, dns-records]
  omnidrive:
    status: available
    phrase: { en: 'Read and write files, wherever they are kept.', fr: 'Lire et écrire des fichiers, où qu’ils soient gardés.' }
    capabilities: [files]
  omnifood:
    status: available
    phrase: { en: 'Receive a restaurant’s orders and reservations.', fr: 'Recevoir les commandes et les réservations d’un restaurant.' }
    capabilities: [orders, reservations, menus, food-facts]
    help_wanted: true
    providers:
      omnifood/openfoodfacts:
        name: Open Food Facts
        status: wanted
        capabilities: [food-facts]
        help_wanted: true
        policy:
          auth: none
          commercial: yes
          attribution: required
          note: { en: 'Data under ODbL (attribution and share-alike); a User-Agent naming the application is asked for.', fr: 'Données sous ODbL (attribution et partage à l’identique) ; un User-Agent nommant l’application est demandé.' }
          terms: 'https://world.openfoodfacts.org/terms-of-use'
          read: '2026-11-10'
  omnimap:
    status: available
    phrase: { en: 'Draw a map, whoever provides it.', fr: 'Dessiner une carte, quel que soit le fournisseur.' }
    capabilities: [maps, geocoding, tiles]
  omniplay:
    status: available
    phrase: { en: 'Put a game on the stores, and play it online.', fr: 'Mettre un jeu sur les boutiques, et y jouer en ligne.' }
    capabilities: [games, players, game-servers]
  omnipost:
    status: available
    phrase: { en: 'Publish on the social networks, and share a page to them.', fr: 'Publier sur les réseaux sociaux, et y faire partager une page.' }
    capabilities: [publish, share]
    help_wanted: true
    providers:
      omnipost/mastodon:
        name: Mastodon
        status: wanted
        capabilities: [publish]
        help_wanted: true
      omnipost/bluesky:
        name: Bluesky
        status: wanted
        capabilities: [publish]
        help_wanted: true
  omnishow:
