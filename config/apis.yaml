  # omnicrawl (Marco, 2026-11-10): crawling services behind one contract, responsible by default.
  omnicrawl:
    status: available
    phrase: { en: 'Fetch and extract web pages through crawling services, responsibly by default: robots.txt honoured, a policy per target site, provenance kept.', fr: 'Récupérer et extraire des pages web par des services d’exploration, de façon responsable par défaut : robots.txt respecté, une politique par site visé, la provenance gardée.' }
    capabilities: [page-fetch, extract, crawl-runs]
    note: { en: 'Extraction is the family’s own, over any page fetched; the target site’s rules are applied before any service is called.', fr: 'L’extraction est celle de la famille, sur toute page récupérée ; les règles du site visé s’appliquent avant tout appel à un service.' }
    providers:
