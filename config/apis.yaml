# The families and the APIs of the Omni ecosystem, as the site shows them:
# the catalogue's cards (/apis), the families and providers wanted
# (/contribute), and the brief they come from. One file, written by hand.
#
# What the packages themselves say (description, repository, branch,
# verification) is read from catalog/<family>.yaml, which
# app:catalog:import writes; this file adds what no repository holds yet:
# the status of a family that is only reserved or wanted, the capabilities,
# and the usage policy of a provider that has no package yet (a released
# provider declares its own: config/policies.json).
#
#   capabilities  slug: {en, fr} - the labels of the capability tags
#   families      name: the family (omniXXX)
#     status        available | reserved | wanted
#                   available: its core is in the catalogue (catalog/<name>.yaml);
#                   reserved: the name and its repositories are taken, nothing released;
#                   wanted: proposed, looking for maintainers
#     phrase        {en, fr}: what the family answers, in one line
#     capabilities  slugs of `capabilities`
#     help_wanted   true when the family looks for a maintainer
#     note          {en, fr}: one more thing to know about the family (optional)
#     released_capabilities  what its released providers answer, when the family
#                   grew capabilities they do not have (default: all of them)
#     merged        family: [capabilities], or {capabilities, rename: {old: new}} when
#                   its packages are republished as <this family>/<name> - the
#                   families merged into this one; their released providers are
#                   listed under it
#     providers     package: a provider ("omnijob/adzuna") the catalogue does not
#                   list yet, or what the site adds to a released one
#       name          the service's name
#       status        available | reserved | wanted (available: in the catalogue)
#       capabilities  a subset of the family's
#       help_wanted   true when no maintainer is named
#       access        oauth | contract: how the key a released provider's policy
#                     asks for is obtained, where the site knows it (the schema
#                     says only whether a key is needed)
#       policy        ONLY for a provider wanted or reserved, with no package yet:
#                     its usage policy as its own pages say it (read on the date
#                     given). A released provider's policy is its package's
#                     policy.json, read by app:policies:import into
#                     config/policies.json; a `policy:` block on one is an error.
#         auth          none | key | oauth | contract
#         commercial    yes | no | conditional | unclear
#         attribution   required | per-item | encouraged | none | unclear
#         credit        the credit the provider asks for, verbatim (optional)
#         note          {en, fr}: the one thing to know (optional)
#         terms         the policy page read
#         read          the date it was read (YYYY-MM-DD)

