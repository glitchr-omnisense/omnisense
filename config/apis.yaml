    phrase: { en: 'Describe a work, play a video, follow a live stream.', fr: 'Décrire une œuvre, lire une vidéo, suivre un direct.' }
    capabilities: [works, videos, live]
  omnisong:
    status: available
    phrase: { en: 'Let a musician’s catalogue be heard.', fr: 'Faire entendre le catalogue d’un musicien.' }
    capabilities: [releases, previews, links, podcasts]
    help_wanted: true
    providers:
      omnisong/musicbrainz:
        name: MusicBrainz
