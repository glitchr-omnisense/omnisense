      omnistay/local: { name: A site’s own listings, status: available, capabilities: [stays, bookings] }

  # Built on 2026-11-10: omnilang and omnical (reserved that morning), omnicrawl. Then the proposals (Marco's
  # decisions of 2026-11-10): omniphoto for later, omnijob and omnisport open to contributors; omniproof went
  # into omnisign, omnitally into omnibill, omnireach, omnireview and omnifund into omnipulse.
  omnilang:
    status: available
    phrase: { en: 'Translate a text or a page, whatever the engine.', fr: 'Traduire un texte ou une page, quel que soit le moteur.' }
    capabilities: [translate, detect, glossary, documents]
    providers:
      omnilang/deepl: { name: DeepL API, capabilities: [translate, glossary, documents], status: available }
      omnilang/google: { name: Google Cloud Translation, capabilities: [translate, detect, glossary, documents], access: oauth, status: available }
      omnilang/azure: { name: Azure AI Translator, capabilities: [translate, detect, documents], status: available }
      omnilang/amazon: { name: Amazon Translate, capabilities: [translate, glossary, documents], status: available }
      omnilang/libretranslate: { name: LibreTranslate, capabilities: [translate, detect, documents], status: available }
  omnical:
    status: available
    phrase: { en: 'Read and write a calendar, and know the public holidays.', fr: 'Lire et écrire un agenda, et connaître les jours fériés.' }
    capabilities: [calendar-events, free-busy, holidays]
    note: { en: 'Nager.Date and OpenHolidays are declarative providers: a data file each (provider.json), no code of their own.', fr: 'Nager.Date et OpenHolidays sont des fournisseurs déclaratifs : un fichier de données chacun (provider.json), sans code propre.' }
    providers:
      omnical/google: { name: Google Calendar, capabilities: [calendar-events, free-busy], access: oauth, status: available }
      omnical/microsoft: { name: Microsoft Graph calendar, capabilities: [calendar-events, free-busy], access: oauth, status: available }
      omnical/caldav: { name: CalDAV (iCloud, Fastmail, Nextcloud…), capabilities: [calendar-events, free-busy], status: available }
