parameters:
    # Who the site is (App\Site\Identity, the Twig global `site`).
    app.site.name: "Omniscient"
    app.site.publisher: "Glitch Art"
    # Who hosts the site (the legal notice, the privacy page): the static
    # export is published on GitHub Pages (.github/workflows/website.yml).
    app.site.host: "GitHub Pages"
    # The GitHub organisation the packages live under: the "edit this page"
    # links, the repository links, the Sponsors page.
    app.site.github: "glitchr-studio"
    # The public address of the static site (SITE_URL): its origin, or the
    # folder of one it is served under (https://glitchr-studio.github.io/omniscient/)
    # - the canonical and alternate links, the sitemap, the feeds, robots.txt.
    app.site.url: '%env(SITE_URL)%'
    env(SITE_URL): 'http://localhost:8135'

    # The content the site is built from: the curated catalogue (one file per
    # family), the cross-ecosystem guides, the news, the documentation manifest
    # and where app:docs:fetch writes each package's docs/ at its pinned ref.
    app.catalog_dir: '%kernel.project_dir%/catalog'
    app.guides_dir: '%kernel.project_dir%/docs'
    app.news_dir: '%kernel.project_dir%/news'
    app.documentation_file: '%kernel.project_dir%/config/documentation.yaml'
    # The compatibility dashboard's data, written by app:compat:fetch (GitHub's Actions API) at build time.
    app.compatibility_file: '%kernel.project_dir%/config/compatibility.yaml'
    app.docs_dir: '%env(default:app.docs_dir_default:DOCS_DIR)%'
    app.docs_dir_default: '%kernel.project_dir%/var/docs'
    # app:catalog:import only: the working copies of the packages (~/Sites,
    # read only), never read by the website itself.
    app.catalogue.repos_dir: '%env(OMNI_REPOS)%'
    env(OMNI_REPOS): '/srv/repos'
    env(BACKUP_USERNAME): ''
    env(BACKUP_PASSWORD): ''
    env(AKISMET_KEY): ''
    env(CRISP_WEBSITE_ID): ''
    env(DISCORD_TOKEN): ''
    env(DISCORD_WEBHOOK): ''
    env(DOCTRINE_DATABASE_PORT): '3306'
    env(GOOGLE_ANALYTICS_VIEWID): ''
    env(GOOGLE_MAPS_CLIENT_KEY): ''
    env(GOOGLE_MAPS_SECRET): ''
    env(GOOGLE_MAPS_SERVER_KEY): ''
    env(GOOGLE_RECAPTCHA_SITE_KEY): ''
    env(GOOGLE_RECAPTCHA_SECRET): ''
    env(GOOGLE_RECAPTCHA_V2_SECRET): ''
    env(GOOGLE_RECAPTCHA_V2_SITE_KEY): ''
    env(GOOGLE_RECAPTCHA_V3_SECRET): ''
    env(GOOGLE_RECAPTCHA_V3_SITE_KEY): ''
    env(MAILER_TECHNICAL): 'noreply@omniscient.local'
    env(MAILER_CONTACT): 'contact@omniscient.local'
    env(HTTP_REDUCTION): '0'
    env(HTTP_MACHINE): '[]'
    env(HTTP_DOMAIN): '[]'
    env(HTTP_SUBDOMAIN): '[]'
    env(HTTP_PORT): '[]'
    env(HTTP_BASEDIR): '[]'
    google_recaptcha_site_key: '%env(GOOGLE_RECAPTCHA_SITE_KEY)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/DataFixtures/'

    # A static site counts no page view on a server (the core's counter writes
    # to the database at the end of each request): every address is excluded.
    Base\Subscriber\PageViewSubscriber:
        arguments:
            $excludedPrefixes: ['/']

    # Required by webauthn.yaml's repositories (see Chapaland's services.yaml:
    # the alias is resolved before Doctrine would make them autowireable).
    Base\Repository\User\PasskeyRepository: ~
    Base\Security\WebauthnUserEntityRepository: ~

when@test:
    parameters:
        # The tests read their own content: a catalogue, a manifest and a fetched
        # manual of their own (a real environment variable would win over .env.test).
        app.catalog_dir: '%kernel.project_dir%/tests/Fixtures/catalog'
        app.documentation_file: '%kernel.project_dir%/tests/Fixtures/documentation.yaml'
        app.compatibility_file: '%kernel.project_dir%/tests/Fixtures/compatibility.yaml'
        app.docs_dir: '%kernel.project_dir%/tests/Fixtures/docs'
        app.news_dir: '%kernel.project_dir%/tests/Fixtures/news'
        app.catalogue.repos_dir: '%kernel.project_dir%/tests/Fixtures/repos'
