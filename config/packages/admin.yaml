admin:
  # Which field stands in for the numeric id in admin URLs.
  #
  # Priority order — the first field the entity has, whose value is neither
  # blank nor all-digits, wins; otherwise the id is used. Both URL generation
  # and URL resolution read this, so old id-based links keep working whatever
  # is set here.
  #
  # Set `fields: []` to go back to plain numeric ids everywhere. Old slug
  # links keep resolving either way — this setting controls what the admin
  # generates, not what it accepts.
  url_identifier:
    fields: ['slug', 'uuid']

    # Safe here because userProfile.username is utf8mb4_general_ci, so the
    # lookup that resolves the URL back is case-insensitive: a User stored
    # as "Marki" links as /admin/users/marki and still loads. A mixed-case
    # URL is accepted as-is rather than redirected.
    lowercase: true

    entities:
      # username is an application-level idea — the base app identifies a
      # User by its id — so it is opted into here rather than shipped as a
      # bundle default. /admin/users/marki instead of /admin/users/14.
      App\Entity\User: ['username']
