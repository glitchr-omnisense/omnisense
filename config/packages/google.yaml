google:
  analytics:
    enable: false

  maps:
    enable: false
    apikey:
      client: "%env(default::GOOGLE_MAPS_CLIENT_KEY)%"
      server: "%env(default::GOOGLE_MAPS_SERVER_KEY)%"

  # reCAPTCHA v3 on the forms a visitor fills (the newsletter, the contact
  # form): off by default - no Google script, no cookie -
  # Akismet (omnibase's SpamChecker, AKISMET_KEY) checks them alone. Turn it
  # on with GOOGLE_RECAPTCHA_SITE_KEY / GOOGLE_RECAPTCHA_SECRET when spam
  # gets through regardless; glitchr/ux-google then adds its ReCaptchaV3Type.
  recaptcha:
    enable: false

  tag_manager:
    enable: false
