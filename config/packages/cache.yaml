# A static site: the application runs at build time, in one process - no shared
# Redis pool, no APCu layer.
framework:
    cache:
        prefix_seed: '%env(APP_SECRET)%'

        pools:
            cache.adapter:
                adapter: cache.adapter.filesystem
            doctrine.result_cache_pool:
                adapter: cache.adapter.filesystem
            doctrine.system_cache_pool:
                adapter: cache.adapter.filesystem
