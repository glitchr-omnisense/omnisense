# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    ide: "vscode://file/%%f[%%b:%env(APP_PATH)%]:%%l"

    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    http_method_override: false
    http_cache: true
    
    trusted_proxies: ['172.16.0.0/12', '10.0.0.0/8', '127.0.0.1']
    trusted_headers: [x-forwarded-for, x-forwarded-host, x-forwarded-proto, x-forwarded-port, x-forwarded-prefix]

    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.dynamic
        cookie_lifetime: 0
        gc_maxlifetime: 86400
        name: PHPSESSID

    esi: true
    fragments: true
    php_errors:
        log: true

    error_controller: Base\Controller\ErrorController::Main
    handle_all_throwables: true

when@dev:
    framework:
        http_cache: false
when@test:
    framework:
        test: true
        http_client:
            mock_response_factory: App\Tests\Mock\NoNetwork
        http_cache: false
        session:
            storage_factory_id: session.storage.factory.mock_file
