monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!doctrine", "!cache", "!security", "!request"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            firephp:
               type: firephp
               level: info
               channels: ["!event", "!doctrine", "!cache", "!security", "!request", "!http_client"]
            chromephp:
               type: chromephp
               level: info
               channels: ["!event", "!doctrine", "!cache", "!security", "!request", "!http_client"]

when@test:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            firephp:
               type: firephp
               level: info
               channels: ["!event", "!doctrine", "!cache", "!security", "!request", "!http_client"]
            chromephp:
               type: chromephp
               level: info
               channels: ["!event", "!doctrine", "!cache", "!security", "!request", "!http_client"]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 1024
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
                channels: ["!event", "!doctrine", "!cache", "!security"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!cache", "!security"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
