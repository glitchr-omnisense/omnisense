# Sign in with Google (base-bundle's Base\Security\UserProvider). Empty ids
# leave the button off the login page.
hwi_oauth:
    resource_owners:
        google:
            type:                google
            client_id:           '%env(default::OAUTH_GOOGLE_CLIENT_ID)%'
            client_secret:       '%env(default::OAUTH_GOOGLE_CLIENT_SECRET)%'
            scope:               "email profile"
            options:
                csrf: true
