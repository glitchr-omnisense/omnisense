framework:
    default_locale: 'fr'
    translator:
        default_path: '%kernel.project_dir%/translations'
        # omnibase's Localizer offers the default plus these: FR, EN.
        # A fallback's parent locale is never tried (fr_FR never reaches .fr):
        # plain language codes here, as on Nakaya and LTO.
        fallbacks:
            - fr
            - en
