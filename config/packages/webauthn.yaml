# Please see the following page for more information: https://webauthn-doc.spomky-labs.com/the-webauthn-server/the-symfony-way#configuration

webauthn:
    credential_repository: 'Base\Repository\User\PasskeyRepository'
    user_repository: 'Base\Security\WebauthnUserEntityRepository'
    creation_profiles:
        default:
            rp:
                # `name` was removed here, not renamed: it is deprecated since
                # web-auth/webauthn-symfony-bundle 5.3.0 and has no
                # replacement key — the relying party is identified by its id.
                #
                # Visible consequence: with no name the bundle falls back to
                # the id (see PublicKeyCredentialCreationOptionsFactory::
                # createRpEntity()), so the browser's passkey prompt now shows
                # the DOMAIN rather than "%env(RELYING_PARTY_NAME)%". That env
                # var is now unused by this file.
                id: '%env(RELYING_PARTY_ID)%'
    request_profiles:
        default:
            rp_id: '%env(RELYING_PARTY_ID)%'
