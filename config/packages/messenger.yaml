framework:
    messenger:
        transports:
            # The queue container (Redis), drained by the worker service.
            async:
               dsn: "%env(MESSENGER_TRANSPORT_DSN)%"
               retry_strategy:
                  max_retries: 3
                  multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
        routing:
           Symfony\Component\Mailer\Messenger\SendEmailMessage:  async
           Symfony\Component\Notifier\Message\EmailMessage:  async
        failure_transport: failed

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
