# The search engine (glitchr/typesense-bundle, the compose service "search").
# No entity is mapped: omnibase/docs indexes the manuals' pages through this
# connection (wikidoc.search.typesense, `bin/console wikidoc:index`), one
# collection per manual and version. One second to connect: with the server
# stopped, the manuals' own index answers instead.
typesense:
    default_connection: default
    connections:
        default:
            secret: '%env(TYPESENSE_SECRET)%'
            scheme: '%env(TYPESENSE_SCHEME)%'
            host: '%env(resolve:TYPESENSE_HOST)%'
            port: '%env(int:TYPESENSE_PORT)%'
            path: 'omniscient'
            options:
                connection_timeout_seconds: 1
