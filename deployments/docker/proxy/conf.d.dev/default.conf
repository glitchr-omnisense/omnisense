# =====================================================
# NGINX EDGE PROXY (DEVELOPMENT)
# Terminates TLS and forwards to the `web` service (nginx + php-fpm).
# =====================================================

resolver 127.0.0.11 ipv6=off valid=10s;

# WebSocket support
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# The port the browser used, for Symfony's absolute URLs and redirects: 443
# in production, 8443 on a dev machine that publishes the proxy there.
map $http_host $forwarded_port {
    default            443;
    "~:(?<port>\d+)$" $port;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location = /healthz { access_log off; return 204; }

    location / { return 308 https://$http_host$request_uri; }
}

server {

    server_name _;

    listen 443 ssl reuseport;   # TCP for HTTP/1.1 & HTTP/2
    http2 on;

    # If a client mistakenly speaks HTTP on port 443
    error_page 497 https://$http_host$request_uri;

    # Redirects this proxy writes itself stay relative, so they keep the
    # port the browser used (8443 on a dev machine).
    absolute_redirect off;

    # Self-signed in dev (docker-entrypoint.d/01-generate-cert.sh), the pool's
    # own certificate in front of this proxy in production.
    ssl_certificate     /etc/nginx/ssl/localhost.crt;
    ssl_certificate_key /etc/nginx/ssl/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    client_max_body_size        64M;
    client_header_buffer_size   32k;
    large_client_header_buffers 8 128k;

    proxy_buffer_size           64k;
    proxy_buffers               64 32k;
    proxy_busy_buffers_size     128k;

    proxy_http_version 1.1;

    # Forwarded headers, so Symfony (framework.trusted_proxies) sees https
    proxy_set_header Host                 $http_host;
    proxy_set_header X-Real-IP            $remote_addr;
    proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto    https;
    proxy_set_header X-Forwarded-Scheme   https;
    proxy_set_header X-Forwarded-Port     $forwarded_port;
    proxy_set_header X-Forwarded-Host     $http_host;
    proxy_set_header Upgrade              $http_upgrade;
    proxy_set_header Connection           $connection_upgrade;

    location = /healthz { access_log off; return 204; }

    # No password on the site itself in dev; only the consoles below keep one,
    # since the proxy listens on every interface.
    location / {
        set $web http://web:80;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_pass $web;
    }

    # -------------------------------------------------
    # Infrastructure consoles (docker-compose.admin.yml, `make admin`)
    # -------------------------------------------------
    location ^~ /admin/_/ {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location = /admin/_/database     { return 301 /admin/_/database/; }
        location ~ ^/admin/_/database/   { set $adm http://database-admin:80; rewrite ^/admin/_/database(/.*)$ $1 break; proxy_pass $adm; }

        location = /admin/_/queue        { return 301 /admin/_/queue/; }
        location ~ ^/admin/_/queue/      { set $adm http://queue-admin:8081;  rewrite ^/admin/_/queue(/.*)$ $1 break;    proxy_pass $adm; }

        location = /admin/_/cache        { return 301 /admin/_/cache/; }
        location ~ ^/admin/_/cache/      { set $adm http://cache-admin:8081;  rewrite ^/admin/_/cache(/.*)$ $1 break;    proxy_pass $adm; }

        # MailDev's page is index.html; its root answers 404.
        location = /admin/_/mailer       { return 302 /admin/_/mailer/index.html; }
        location = /admin/_/mailer/      { return 302 /admin/_/mailer/index.html; }
        location ~ ^/admin/_/mailer/     { set $adm http://mailer:1080;       rewrite ^/admin/_/mailer(/.*)$ $1 break;   proxy_pass $adm; }

        # php-fpm's own opcache reset (web/conf.d, /tmp/opcache.php)
        location = /admin/_/opcache/clear { set $web http://web:80; proxy_pass $web; }
    }

    # Hide dotfiles
    location ~ /\.(?!well-known) { deny all; }
}
