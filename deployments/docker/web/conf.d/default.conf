# ==================== HTTP-LEVEL (top of default.conf) ====================

# --- Upstream to PHP-FPM ---
upstream php_backend {
    zone php_backend 64k;
    server 127.0.0.1:9000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# --- Proxy micro-cache decision logic ---
proxy_cache_path /var/cache/nginx/edge
                 levels=1:2
                 keys_zone=PROXY:200m
                 inactive=12h
                 max_size=5g
                 use_temp_path=off;

map $request_method $skip_proxy_cache_method {
    default 0;
    POST    1;
}

map $http_authorization $skip_proxy_cache_auth {
    default 0;
    ~.+     1;
}

map $http_cookie $skip_proxy_cache_cookie {
    default 0;
    ~*(PHPSESSID|SESSION|XDEBUG_SESSION) 1;
}

map "$skip_proxy_cache_method$skip_proxy_cache_auth$skip_proxy_cache_cookie" $skip_proxy_cache {
    default 0;
    ~1      1;
}

# --- Extract client IP correctly (from LB) ---
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# --- Detect HTTPS as passed by the LB ---
map $http_x_forwarded_proto $fe_https { default off; https on; }

# --- Micro-cache decision logic ---
map $request_method $skip_cache_method { default 0; POST 1; }
map $http_authorization $skip_cache_auth { default 0; ~.+ 1; }
map $http_cookie $skip_cache_cookie { default 0; ~*(PHPSESSID|XDEBUG_SESSION|_SESSION) 1; }
map $arg_nocache $skip_cache_arg { default 0; 1 1; }

map "$skip_cache_method$skip_cache_auth$skip_cache_cookie$skip_cache_arg" $skip_fcgi_cache {
    default 0;
    ~1 1;
}

# FastCGI microcache
fastcgi_cache_path /var/cache/nginx/fastcgi levels=1:2 keys_zone=FCGI:64m inactive=2m max_size=2g;
fastcgi_cache_key "$scheme$request_method$http_host$request_uri";


# ==================== SERVER (frontend web) ====================

server {
    listen 80;
    server_name _;

    root  /srv/app/public;
    index index.php index.html;

    server_tokens off;

    client_header_buffer_size   16k;
    large_client_header_buffers 8 64k;
    client_max_body_size        512M;

    # ----------------------------------------
    # Health
    # ----------------------------------------
    location = /healthz { access_log off; return 204; }
    
    # ----------------------------------------
    # Manifest MIME override
    # ----------------------------------------
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Content-Type application/manifest+json;
    }

    # ----------------------------------------
    # Normalize URLs with double slashes
    # ----------------------------------------
    if ($request_uri ~* "//") {
        return 301 $scheme://$http_host$uri;
    }

    # Block direct PHP
    location ~ \.php$ { return 404; }


    # ============================================================
    # STATIC FILES — production cache
    # ============================================================
    location ~* \.(?:css|js|mjs|map|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|eot|wasm|webmanifest)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";

        # Prefer precompressed versions (Brotli/Gzip)
        try_files $uri.br $uri.gz $uri /index.php?$query_string;
    }


    # ============================================================
    # Main router
    # ============================================================
    location / {
        try_files $uri /index.php?$query_string;
    }


    # ============================================================
    # PHP front controller (micro-cache, correct XFWD headers)
    # ============================================================
    location = /index.php {

        include fastcgi.conf;

        # Correct SCRIPT_FILENAME
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # -------------------- IMPORTANT --------------------
        # Forward *correct* LB headers (fix broken csrf/url generation)
        fastcgi_param X-Forwarded-Proto  $http_x_forwarded_proto;
        fastcgi_param X-Forwarded-Scheme $http_x_forwarded_scheme;
        fastcgi_param X-Forwarded-Port   $http_x_forwarded_port;
        fastcgi_param X-Forwarded-Host   $http_x_forwarded_host;

        # Allow Symfony to correctly detect HTTPS
        fastcgi_param HTTPS $fe_https;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    30s;
        fastcgi_read_timeout    120s;

        fastcgi_pass php_backend;
        fastcgi_keep_conn on;

        # Enable micro-cache (safe for GET traffic)
        fastcgi_no_cache  $skip_fcgi_cache;
        fastcgi_cache     FCGI;
        fastcgi_cache_valid 200 1s;
        fastcgi_cache_valid 301 302 10s;
        fastcgi_cache_revalidate on;

        add_header X-Cache $upstream_cache_status always;
    }


    # ============================================================
    # PROXY ADMIN BACKENDS (cache allowed)
    # ============================================================
    proxy_set_header Host                $http_host;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto   https;
    proxy_set_header X-Forwarded-Scheme  https;
    proxy_set_header X-Forwarded-Port    443;
    proxy_set_header X-Forwarded-Host    $http_host;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    120s;

    proxy_cache           PROXY;
    proxy_cache_bypass    $skip_proxy_cache;
    proxy_no_cache        $skip_proxy_cache;

    proxy_cache_valid     200 302 10m;
    proxy_cache_valid     301 1h;
    proxy_cache_valid     any  1m;

    add_header X-Proxy-Cache $upstream_cache_status always;

    # ----------------------------------------
    # Clear OPCache Web Interface (Not CLI)
    # ----------------------------------------
    location = /admin/_/opcache/clear {

        include fastcgi.conf;

        fastcgi_param SCRIPT_FILENAME /tmp/opcache.php;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # Forward LB HTTPS metadata (VERY IMPORTANT)
        fastcgi_param X-Forwarded-Proto  $http_x_forwarded_proto;
        fastcgi_param X-Forwarded-Scheme $http_x_forwarded_scheme;
        fastcgi_param X-Forwarded-Port   $http_x_forwarded_port;
        fastcgi_param X-Forwarded-Host   $http_x_forwarded_host;

        # Let Symfony detect HTTPS
        fastcgi_param HTTPS $https if_not_empty;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;

        fastcgi_pass php_backend;
        fastcgi_no_cache 1;
    }

    # ============================================================
    # Hardening
    # ============================================================
    location ~ /\.(?!well-known) { deny all; }

    location ~* /(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|phpunit\.xml|\.env) {
        deny all; return 404;
    }
}