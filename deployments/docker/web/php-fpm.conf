[global]
daemonize               = no
error_log               = /dev/stderr

[www]
listen                  = 0.0.0.0:9000
user = root
group = root

catch_workers_output    = yes
clear_env               = no

pm                      = dynamic
pm.max_children         = 40
pm.start_servers        = 8
pm.min_spare_servers    = 8
pm.max_spare_servers    = 16
pm.max_requests         = 500
pm.status_path          = /status
ping.path               = /ping

; Log PHP errors and slow requests into container logs
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /dev/stderr

request_slowlog_timeout = 5s
slowlog                 = /dev/stderr

access.log              = /dev/null
