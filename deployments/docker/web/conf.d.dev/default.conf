# --- Upstream to PHP-FPM ---
upstream php_backend {
    zone php_backend 64k;
    server 127.0.0.1:9000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /srv/app/public;
    index index.php index.html;
    server_tokens off;

    client_header_buffer_size   16k;
    large_client_header_buffers 8 64k;
    client_max_body_size        512M;

    # ----------------------------------------
    # Health
    # ----------------------------------------
    location = /healthz { access_log off; return 204; }

    # ----------------------------------------
    # Manifest MIME override
    # ----------------------------------------
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Content-Type application/manifest+json;
    }

    # ----------------------------------------
    # Normalize // → /
    # ----------------------------------------
    if ($request_uri ~ "//") {
        return 301 $scheme://$http_host$uri;
    }

    # ----------------------------------------
    # Clear OPCache Web Interface (Not CLI)
    # ----------------------------------------
    location = /admin/_/opcache/clear {

        include fastcgi.conf;

        fastcgi_param SCRIPT_FILENAME /tmp/opcache.php;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # Forward LB HTTPS metadata (VERY IMPORTANT)
        fastcgi_param X-Forwarded-Proto  $http_x_forwarded_proto;
        fastcgi_param X-Forwarded-Scheme $http_x_forwarded_scheme;
        fastcgi_param X-Forwarded-Port   $http_x_forwarded_port;
        fastcgi_param X-Forwarded-Host   $http_x_forwarded_host;

        # Let Symfony detect HTTPS
        fastcgi_param HTTPS $https if_not_empty;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;

        fastcgi_pass php_backend;
        fastcgi_no_cache 1;
    }

    # ----------------------------------------
    # Block direct *.php except explicit ones
    # ----------------------------------------
    location ~ \.php$ {
        return 404;
    }

    # ----------------------------------------
    # phpinfo.php (DEV ONLY)
    # ----------------------------------------
    location = /phpinfo.php {

        include fastcgi.conf;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # Forward LB HTTPS metadata (VERY IMPORTANT)
        fastcgi_param X-Forwarded-Proto  $http_x_forwarded_proto;
        fastcgi_param X-Forwarded-Scheme $http_x_forwarded_scheme;
        fastcgi_param X-Forwarded-Port   $http_x_forwarded_port;
        fastcgi_param X-Forwarded-Host   $http_x_forwarded_host;

        # Let Symfony detect HTTPS
        fastcgi_param HTTPS $https if_not_empty;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;

        fastcgi_pass php_backend;
        fastcgi_no_cache 1;
    }

    # ----------------------------------------
    # Static assets
    # ----------------------------------------
    location ~* \.(css|js|mjs|map|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|eot|wasm)$ {
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri /index.php?$query_string;
    }

    location /assets/ {
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri.br $uri.gz =404;
    }

    # ----------------------------------------
    # Application routing
    # ----------------------------------------
    location / {
        try_files $uri /index.php?$query_string;
    }

    # ----------------------------------------
    # index.php front controller
    # ----------------------------------------
    location = /index.php {

        include fastcgi.conf;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # Forward correct upstream headers
        fastcgi_param X-Forwarded-Proto  $http_x_forwarded_proto;
        fastcgi_param X-Forwarded-Scheme $http_x_forwarded_scheme;
        fastcgi_param X-Forwarded-Port   $http_x_forwarded_port;
        fastcgi_param X-Forwarded-Host   $http_x_forwarded_host;

        fastcgi_param HTTPS $https if_not_empty;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        fastcgi_pass php_backend;
        fastcgi_no_cache 1;
    }

    # ----------------------------------------
    # Security / Hardening
    # ----------------------------------------
    location ~ /\.(?!well-known) { deny all; }

    location ~* /(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|phpunit\.xml|\.env) {
        deny all; return 404;
    }
}