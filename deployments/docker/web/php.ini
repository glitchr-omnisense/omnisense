; ------------------------------------------------------------
;  MEMORY / EXECUTION
; ------------------------------------------------------------
memory_limit = ${PHP_MEMORY_LIMIT:-512M}
post_max_size = ${PHP_POST_MAX_SIZE:-32M}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE:-32M}
max_execution_time = ${PHP_MAX_EXECUTION_TIME:-60}

; ------------------------------------------------------------
;  TIME / SESSION / ERROR HANDLING
; ------------------------------------------------------------
date.timezone = ${PHP_TIMEZONE:-UTC}
session.auto_start = Off
session.save_handler = redis
session.save_path = "tcp://${PHP_REDIS_URL:-redis:6379}?persistent=1&timeout=2&read_timeout=2"

; Off: the mitigation php.net gives for CVE-2026-109619 (2026-10-21, fixed in
; PHP 8.4.27). It must apply before the request is parsed: here, not
; ini_set() nor .user.ini. Nothing of the site reads the upload progress.
session.upload_progress.enabled = 0

log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
error_log = /var/log/php/php.log

; ------------------------------------------------------------
;  APCu
; ------------------------------------------------------------
apc.enabled = 1
apc.shm_size = 64M
apc.enable_cli = 0

; ------------------------------------------------------------
;  OPCACHE (production defaults)
; ------------------------------------------------------------
[opcache]
opcache.enable                  = ${PHP_OPCACHE:-1}
opcache.enable_cli              = 0
opcache.memory_consumption      = 256
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files   = 200000

; ---- Defaults to production-safe mode ----
opcache.validate_timestamps     = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-0}
opcache.revalidate_freq         = ${PHP_OPCACHE_REVALIDATE_FREQ:-60}
opcache.file_update_protection  = ${PHP_OPCACHE_FILE_UPDATE_PROTECTION:-2}

; ---- Preload only in prod ----
opcache.preload                 = ${PHP_OPCACHE_PRELOAD:-/srv/app/config/preload.php}
opcache.preload_user            = ${PHP_OPCACHE_PRELOAD_USER:-root}

; ------------------------------------------------------------
;  XDEBUG (disabled by default)
; ------------------------------------------------------------
[xdebug]
; Only enable debug when explicitly triggered
xdebug.mode = ${PHP_XDEBUG:-off}
xdebug.start_with_request = trigger

; IDE connection settings (used when triggered)
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003

; Logging (optional)
xdebug.log = /tmp/xdebug.log
xdebug.log_level = 10

; ------------------------------------------------------------
;  BLACKFIRE (disabled by default)
; ------------------------------------------------------------
[blackfire]
; extension=blackfire.so
; blackfire.enabled = ${BLACKFIRE_APM_ENABLED:-0}
; blackfire.agent_socket = /var/run/blackfire/blackfire-agent.sock

; On Windows use the following configuration:
; extension=php_blackfire.dll

; Sets fine-grained configuration for Probe.
; This should be left blank in most cases. For most installs,
; the server credentials should only be set in the agent.
;blackfire.server_id =

; Sets fine-grained configuration for Probe.
; This should be left blank in most cases. For most installs,
; the server credentials should only be set in the agent.
;blackfire.server_token =

; Log verbosity level:
;   4: debug
;   3: info
;   2: warning;
;   1: error
;blackfire.log_level = 1

; Log file (STDERR by default)
;blackfire.log_file = /tmp/blackfire.log

; Add the stacktrace to the probe logs when a segmentation fault occurs.
; Debug option inactive on Windows and Alpine.
;blackfire.debug.sigsegv_handler = 0

; Sets the socket where the agent is listening.
; Possible value can be a unix socket or a TCP address.
; Defaults values are:
;   - Linux: unix:///var/run/blackfire/agent.sock
;   - macOS amd64: unix:///usr/local/var/run/blackfire-agent.sock
;   - macOS arm64 (M1): unix:///opt/homebrew/var/run/blackfire-agent.sock
;   - Windows: tcp://127.0.0.1:8307
;blackfire.agent_socket = unix:///var/run/blackfire/agent.sock

; Enables Blackfire Monitoring
; Enabled by default since version 1.61.0
;blackfire.apm_enabled = 1