# The omnishield entry of the Omniscient catalogue. Written by `bin/console
# app:catalog:import` from the packages' repositories; the phrase and the
# text are the site's own, edited here. Each package: its kind, what its
# composer.json says, its GitHub repository and development branch, whether
# its README says it was verified against the real service, whether it has
# a docs/ folder (see config/documentation.yaml).
family: omnishield
phrase:
  en: 'Guard a form: captcha, spam, addresses known for abuse.'
  fr: 'Garder un formulaire : captcha, pourriel, adresses connues pour abus.'
text:
  en: 'One contract for guarding a form: is this token valid (ALTCHA, Turnstile, reCAPTCHA), is this text spam (Akismet), is this address known for abuse (StopForumSpam, disposable domains) - whoever answers; a form field and a constraint on the Symfony side.'
  fr: 'Un seul contrat pour garder un formulaire : ce jeton est-il valable (ALTCHA, Turnstile, reCAPTCHA), ce texte est-il un pourriel (Akismet), cette adresse est-elle connue pour abus (StopForumSpam, domaines jetables) — quel que soit celui qui répond ; un champ de formulaire et une contrainte côté Symfony.'
packages:
  omniscient/omnishield:
    kind: family
    description: "Omnishield: one contract for guarding a form - is this token valid (a captcha: ALTCHA, Turnstile, reCAPTCHA), is this content spam (Akismet), are this address, this e-mail, this name known for abuse (StopForumSpam, disposable e-mail domains) - whoever answers; and its Symfony bridge: a form field, a constraint, the ALTCHA challenge's route, a Twig function."
    license: MIT
    keywords:
      - captcha
      - spam
      - antispam
      - altcha
      - turnstile
      - recaptcha
      - akismet
      - stopforumspam
      - disposable-email
      - omnishield
    repository: glitchr-studio/omnishield
    branch: 1.x
    verification: unstated
    docs: true
  omnishield/akismet:
    kind: provider
    description: 'Omnishield Akismet: is this content spam - comment-check (ham, spam, or flagrant spam to discard), submit-spam and submit-ham to teach it, verify-key; a key or transport error raised, never taken for ham.'
    license: MIT
    keywords:
      - spam
      - antispam
      - akismet
      - comments
      - omnishield
    repository: glitchr-studio/omnishield-akismet
    branch: 1.x
    requires:
      - omniscient/omnishield
    verification: verified
    verification_note: 'Documentation: what it calls, the credentials, the capabilities, an example run offline, the errors, the fields sent, the answers, the options, what was verified - nothing against Akismet itself: no key.'
    docs: true
  omnishield/altcha:
    kind: provider
    description: "Omnishield ALTCHA: a proof of work the site issues and checks itself, on altcha-org/altcha - a challenge signed with the site's key, the solution the visitor's browser found checked, a solution refused the second time; no third party, no cookie."
    license: MIT
    keywords:
      - captcha
      - altcha
      - proof-of-work
      - privacy
      - antispam
      - omnishield
    repository: glitchr-studio/omnishield-altcha
    branch: 1.x
    requires:
      - omniscient/omnishield
    verification: verified
    verification_note: 'Documentation: what it calls, the credentials, the capabilities, an example run offline, the errors, the options, the widget and its script, the challenge in the page or from a route, the action, what was verified - the whole way in PHP: issued, solved by the library, verified, refused when posted again.'
    docs: true
  omnishield/disposable:
    kind: provider
    description: "Omnishield Disposable: is this e-mail's domain a disposable one - the free disposable-email-domains list (CC0) shipped in the package, an allow list and a deny list of the site's, subdomains included; no call while a request runs, a command to refresh the list."
    license: MIT
    keywords:
      - email
      - disposable-email
      - temporary-email
      - blocklist
      - antispam
      - omnishield
    repository: glitchr-studio/omnishield-disposable
    branch: 1.x
    requires:
      - omniscient/omnishield
    verification: verified
    verification_note: "Documentation: what it calls, the credentials, the capabilities, an example run offline, the errors, the matching, the options, the refresh, the list's licence, what was verified."
    docs: true
  omnishield/recaptcha:
    kind: provider
    description: "Omnishield reCAPTCHA: Google's captcha - v2 checkbox and invisible, v3 score with its threshold and action, and reCAPTCHA Enterprise assessments - its token checked by direct calls, no Google library."
    license: MIT
    keywords:
      - captcha
      - recaptcha
      - google
      - antispam
      - omnishield
    repository: glitchr-studio/omnishield-recaptcha
    branch: 1.x
    requires:
      - omniscient/omnishield
    verification: verified
    verification_note: "Documentation: what it calls, the credentials, the capabilities, an example run offline, the errors, the four modes, the options, the answers, the test keys, what was verified - v2 against Google with its test keys; v3 and Enterprise on answers written from Google's documentation, no key."
    docs: true
  omnishield/stopforumspam:
    kind: provider
    description: "Omnishield StopForumSpam: are this IP address, this e-mail (sent hashed), this name reported for abuse - the public database's frequency, confidence and last sighting, a threshold of the site's; reports with an API key."
    license: MIT
    keywords:
      - spam
      - antispam
      - stopforumspam
      - reputation
      - blocklist
      - omnishield
    repository: glitchr-studio/omnishield-stopforumspam
    branch: 1.x
    requires:
      - omniscient/omnishield
    verification: verified
    verification_note: "Documentation: what it calls, the credentials, the capabilities, an example run offline, the errors, the options, the answer and how it is read, the terms, what was verified - lookups on the documentation's values and a Tor exit node, for real, on 2026-10-07."
    docs: true
  omnishield/turnstile:
    kind: provider
    description: "Omnishield Turnstile: Cloudflare's captcha - the widget, and its token checked by Cloudflare's siteverify (the visitor's address, the action and the host checked back, a request retried under its idempotency key)."
    license: MIT
    keywords:
      - captcha
      - turnstile
      - cloudflare
      - antispam
      - omnishield
    repository: glitchr-studio/omnishield-turnstile
    branch: 1.x
    requires:
      - omniscient/omnishield
    verification: verified
    verification_note: 'Documentation: what it calls, the credentials, the capabilities, an example run offline, the errors, the options, the answers, the testing keys, what was verified - the three testing secrets against Cloudflare, on 2026-10-07.'
    docs: true
