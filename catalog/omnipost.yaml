# The omnipost entry of the Omnisense catalogue. Written by `bin/console
# app:catalog:import` from the packages' repositories; the phrase and the
# text are the site's own, edited here. Each package: its kind, what its
# composer.json says, its GitHub repository and development branch, its
# latest stable release on Packagist (`version`, none when nothing is tagged)
# and whether it is abandoned, whether its README says it was verified against
# the real service, whether it has a docs/ folder (see config/documentation.yaml).
family: omnipost
phrase:
  en: 'Publish on the social networks, and share a page to them without their scripts.'
  fr: 'Publier sur les réseaux sociaux, et y partager une page sans leurs scripts.'
text:
  en: "Two contracts for the social networks. Publish: a reel, a picture, a carousel through a network's API, one's own feed read back, and what each network imposes. Share: a page's address, title, text, picture and hashtags turned into each network's share page, an e-mail, a copied link and the device's share sheet - plain links, no network script, no cookie, no credential."
  fr: 'Deux contrats pour les réseaux sociaux. Publier : un reel, une photo, un carrousel par l’API d’un réseau, son propre fil relu, et ce que chaque réseau impose. Partager : l’adresse, le titre, le texte, l’image et les mots-dièse d’une page changés en la page de partage de chaque réseau, un e-mail, un lien copié et la feuille de partage de l’appareil — de simples liens, aucun script de réseau, aucun cookie, aucun identifiant.'
packages:
  omnipost/instagram:
    kind: provider
    description: "Omnipost Instagram: the account's feed, the publication of pictures, carousels and reels, and the long-lived token's refresh, through the Instagram API with Instagram Login."
    license: MIT
    keywords:
      - social
      - instagram
      - reels
      - omnipost
    repository: glitchr-omnisense/omnipost-instagram
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
      - omnisense/omnipost
    verification: unstated
    docs: true
  omnipost/youtube:
    kind: provider
    description: "Omnipost YouTube: the channel's videos through the Data API (a key), and Shorts uploaded through OAuth."
    license: MIT
    keywords:
      - social
      - youtube
      - shorts
      - omnipost
    repository: glitchr-omnisense/omnipost-youtube
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
      - omnisense/omnipost
    verification: unstated
    docs: true
  omnisense/omnipost:
    kind: family
    description: "Omnipost: the social networks' family. Publish: one contract for publishing a post - a reel, a picture, a carousel - through a network's API, reading one's own feed, and the capabilities each network imposes. Share: plain share links for visitors (Facebook, X, Pinterest, LinkedIn, Bluesky, Mastodon, Threads, WhatsApp, Telegram, Reddit, e-mail, copy, share sheet) - no network script, no cookie, one JSON for Twig, Blade and React. And its Symfony bundle."
    license: MIT
    keywords:
      - social
      - publishing
      - instagram
      - youtube
      - reels
      - share
      - 'share links'
      - 'share buttons'
      - facebook
      - x
      - pinterest
      - linkedin
      - bluesky
      - mastodon
      - threads
      - whatsapp
      - telegram
      - reddit
      - omnipost
      - omnishare
    repository: glitchr-omnisense/omnipost
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
    verification: unstated
    docs: true
