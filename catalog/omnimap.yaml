# The omnimap entry of the Omniscient catalogue. Written by `bin/console
# app:catalog:import` from the packages' repositories; the phrase and the
# text are the site's own, edited here. Each package: its kind, what its
# composer.json says, its GitHub repository and development branch, whether
# its README says it was verified against the real service, whether it has
# a docs/ folder (see config/documentation.yaml).
family: omnimap
phrase:
  en: 'Draw a map, whoever provides it.'
  fr: 'Dessiner une carte, quel que soit le fournisseur.'
text:
  en: "One description of a map view (centre, zoom, markers) that a provider's driver draws in the browser, the provider's image of it made on the server, geocoding, and a map cache kept in the host's storage."
  fr: 'Une description d’une vue de carte (centre, zoom, marqueurs) que le pilote d’un fournisseur dessine dans le navigateur, son image faite côté serveur, le géocodage, et un cache de cartes gardé dans le stockage de l’hôte.'
packages:
  omnimap/google:
    kind: provider
    description: "Omnimap's Google Maps, under any PHP host: the live map drawn by the Maps JavaScript API (a driver for omnimap's script: markers, styled map types by zoom), a view as a Static Maps image (the URL signed with the secret), geocoding through geocoder-php's GoogleMaps provider, and glitchr/ux-google's names for the pictures it captured."
    license: MIT
    keywords:
      - map
      - maps
      - google-maps
      - static-maps
      - geocoding
      - framework-agnostic
      - omnimap
    repository: glitchr-studio/omnimap-google
    branch: 1.x
    requires:
      - omniscient/omnimap
    verification: partial
    verification_note: "- Not verified live: Google's answers themselves (Static Maps, Geocoding, the Maps JavaScript API drawn by assets/google.js) - no key in the harness."
    docs: true
  omnimap/maplibre:
    kind: provider
    description: "Omnimap's MapLibre, under any PHP host: the live map drawn by MapLibre GL JS from a vector style (OpenFreeMap's by default: no key, no cookie), a driver for omnimap's script, and the style read on the server to name every host the browser reaches."
    license: MIT
    keywords:
      - map
      - maps
      - maplibre
      - maplibre-gl
      - vector-tiles
      - openfreemap
      - openstreetmap
      - framework-agnostic
      - omnimap
    repository: glitchr-studio/omnimap-maplibre
    branch: 1.x
    requires:
      - omniscient/omnimap
    verification: partial
    verification_note: "- Verified live, no key (vendor/bin/phpunit --group live, 2026-10-25): OpenFreeMap's style, its TileJSON, a vector tile of Strasbourg, a glyph range and the sprite, all on the declared host; unpkg's MapLibre GL JS 5.24.0 and its stylesheet against the SHA-384 hashes the browser checks, with the CORS header that check n — - Not verified: MapLibre GL JS 6 loaded as a module (library_module), styles other than OpenFreeMap's, assets/capture.js sending a MapLibre picture to a host's cache."
    docs: true
  omnimap/openstreetmap:
    kind: provider
    description: "Omnimap's OpenStreetMap, under any PHP host: the live map drawn by Leaflet over a tile server of your choice (a driver for omnimap's script), a view as an image made on the server from the same tiles (the application's User-Agent, the tiles kept as their Cache-Control allows, the attribution drawn), and Nominatim's geocoding through geocoder-php (one call a second at most, answers kept)."
    license: MIT
    keywords:
      - map
      - maps
      - openstreetmap
      - osm
      - leaflet
      - tiles
      - nominatim
      - geocoding
      - framework-agnostic
      - omnimap
    repository: glitchr-studio/omnimap-openstreetmap
    branch: 1.x
    requires:
      - omniscient/omnimap
    verification: partial
    verification_note: "- Verified live (docker compose run --rm omnimap live, 2026-10-23): an image of Kyoto made of tile.openstreetmap.org's tiles (the response headers: access-control-allow-origin: *, cache-control: max-age=91080, stale-while-revalidate=604800, stale-if-error=604800) and one Nominatim query, with the package's User-Agent. — - Not verified: Leaflet's live map (assets/leaflet.js) in a browser; another tile provider."
    docs: true
  omniscient/omnimap:
    kind: family
    description: "Omnimap: maps under any PHP host, whoever draws them - one description of a view (centre, zoom, markers) that a provider's driver draws in the browser, the provider's image of it made on the server, geocoding over geocoder-php, and the map cache: the picture of a view, signed, cut in tiles, kept in a storage of the host's and served from it, captured by the browser or made by the server. Providers are packages of their own (omnimap/google, omnimap/openstreetmap); the Symfony and Laravel bridges live in omnibridge."
    license: MIT
    keywords:
      - map
      - maps
      - geocoding
      - static-map
      - tiles
      - leaflet
      - google-maps
      - openstreetmap
      - framework-agnostic
      - omnimap
    repository: glitchr-studio/omnimap
    branch: 1.x
    verification: partial
    verification_note: "- Verified live (docker compose run --rm omnimap live, 2026-10-23): an image of Kyoto made of tile.openstreetmap.org's tiles and one Nominatim query, with this package's User-Agent. — - Not verified here: the JavaScript in a browser; Google's live answers (no key in this harness: see omnimap/google)."
    docs: true
