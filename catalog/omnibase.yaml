# The omnibase entry of the Omniscient catalogue. Written by `bin/console
# app:catalog:import` from the packages' repositories; the phrase and the
# text are the site's own, edited here. Each package: its kind, what its
# composer.json says, its GitHub repository and development branch, whether
# its README says it was verified against the real service, whether it has
# a docs/ folder (see config/documentation.yaml).
family: omnibase
phrase:
  en: 'The core of the sites, and optional ready-made structures.'
  fr: 'Le cœur des sites, et des structures toutes prêtes, facultatives.'
text:
  en: 'omniscient/omnibase is the core of the sites: accounts and security, back office, translations, pictures, forms, screens - framework-free since 4.0, run under Symfony or Laravel through omnibridge. The prepared structures omnibase/<trade> assemble a trade on it in advance; they are optional: nothing in the core or the families depends on them.'
  fr: 'omniscient/omnibase est le cœur des sites : comptes et sécurité, back-office, traductions, images, formulaires, écrans — sans cadre depuis la 4.0, il tourne sous Symfony ou Laravel par omnibridge. Les structures préparées omnibase/<métier> y assemblent un métier à l’avance ; elles sont facultatives : rien dans le cœur ni dans les familles n’en dépend.'
packages:
  omnibase/admin:
    kind: structure
    description: 'Administration backoffice for base-bundle: dynamic CRUD, dashboard, menus and field-based form generation'
    license: MIT
    keywords:
      - symfony
      - admin
      - backoffice
      - crud
      - dashboard
    repository: glitchr-studio/omnibase-admin
    branch: main
    requires:
      - omnibridge/symfony
      - omniscient/omnibase
    verification: unstated
    docs: true
  omnibase/agenda:
