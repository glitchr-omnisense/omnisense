# The omnibus entry of the Omnisense catalogue. Written by `bin/console
# app:catalog:import` from the packages' repositories; the phrase and the
# text are the site's own, edited here. Each package: its kind, what its
# composer.json says, its GitHub repository and development branch, whether
# its README says it was verified against the real service, whether it has
# a docs/ folder (see config/documentation.yaml).
family: omnibus
phrase:
  en: 'Ship a parcel, whatever the carrier.'
  fr: 'Expédier un colis, quel que soit le transporteur.'
text:
  en: 'One contract for parcel carriers: rates, labels, tracking, pickup points.'
  fr: 'Un seul contrat pour les transporteurs : tarifs, étiquettes, suivi, points relais.'
packages:
  omnibus/amazon:
    kind: provider
    description: 'Omnibus Amazon Shipping: rates, shipments and labels, tracking and cancellations - the Selling Partner Shipping API v2.'
    license: MIT
    keywords:
      - shipping
      - carrier
      - omnibus
      - amazon
    repository: glitchr-omnisense/omnibus-amazon
    branch: 2.x
    requires:
      - omnisense/omnibus
    verification: unstated
    docs: true
  omnibus/aramex:
    kind: provider
    description: 'Omnibus Aramex: rates, shipments and labels, tracking and offices - the Shipping, Tracking and Location services (JSON).'
    license: MIT
    keywords:
      - shipping
      - carrier
      - omnibus
      - aramex
    repository: glitchr-omnisense/omnibus-aramex
