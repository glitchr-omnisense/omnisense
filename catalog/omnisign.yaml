# The omnisign entry of the Omnisense catalogue. Written by `bin/console
# app:catalog:import` from the packages' repositories; the phrase and the
# text are the site's own, edited here. Each package: its kind, what its
# composer.json says, its GitHub repository and development branch, its
# latest stable release on Packagist (`version`, none when nothing is tagged)
# and whether it is abandoned, whether its README says it was verified against
# the real service, whether it has a docs/ folder (see config/documentation.yaml).
family: omnisign
phrase:
  en: 'Have a document signed.'
  fr: 'Faire signer un document.'
text:
  en: 'One contract for having documents signed: create an envelope (documents, signers, fields, a simple, advanced or qualified level), send it, follow it, remind, cancel, sign in the page, download the signed documents and their evidence - Yousign, DocuSign, DocuSeal.'
  fr: 'Un seul contrat pour faire signer : créer une enveloppe (documents, signataires, champs, niveau simple, avancé ou qualifié), l’envoyer, la suivre, relancer, annuler, signer dans la page, télécharger les documents signés et leurs preuves — Yousign, DocuSign, DocuSeal.'
packages:
  omnisense/omnisign:
    kind: family
    description: "Omnisign: one contract for having documents signed - create an envelope (documents, signers, fields, a level: simple, advanced, qualified), send it, follow it, remind, cancel, sign in the application's page, download the signed documents and their evidence, hear the provider's webhooks - whoever signs: Yousign (omnisign/yousign), DocuSign (omnisign/docusign), a DocuSeal instance (omnisign/docuseal) - and, since 1.1, verify an identity (a document and a selfie, the checks performed: Stripe Identity, omnisign/stripe-identity) and obtain a rental applicant's file through a consented connect flow (DossierFacile, omnisign/dossierfacile); and its Symfony bundle."
    license: MIT
    keywords:
      - signature
      - e-signature
      - eidas
      - yousign
      - docusign
      - docuseal
      - identity-verification
      - kyc
      - tenant-file
      - dossierfacile
      - stripe-identity
      - omnisign
    repository: glitchr-omnisense/omnisign
    branch: 1.x
    version: 1.2.0
    requires:
      - omnisense/contracts
    verification: unstated
    docs: true
  omnisign/docuseal:
    kind: provider
    description: "Omnisign DocuSeal: documents signed on a DocuSeal instance of one's own (open source, AGPL) or DocuSeal's cloud - a submission from a template, or from a PDF where the edition allows it, its submitters, embedded signing, reminders, the signed documents and the audit log, webhooks with their X-Docuseal-Signature checked; nothing leaves for a third party when self-hosted."
    license: MIT
    keywords:
      - signature
      - e-signature
      - docuseal
      - self-hosted
      - omnisign
    repository: glitchr-omnisense/omnisign-docuseal
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
      - omnisense/omnisign
    verification: verified
    verification_note: 'Verified in real on 2026-10-08 against an instance of the open-source edition run in Docker: created, signing link, completed, downloaded (signed PDF and audit log), archived.'
    docs: true
  omnisign/docusign:
    kind: provider
    description: "Omnisign DocuSign: envelopes through DocuSign's eSignature REST API v2.1 - JWT grant with the application's RSA key, documents, signers in order, signature tabs, embedded signing (recipient views), reminders, voiding, the combined signed document and the certificate of completion, Connect webhooks with their HMAC checked."
    license: MIT
    keywords:
      - signature
      - e-signature
      - docusign
      - omnisign
    repository: glitchr-omnisense/omnisign-docusign
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
      - omnisense/omnisign
    verification: partial
    verification_note: "Documentation: the options and the JWT grant, from an envelope to DocuSign's, Connect, what was verified. — Not verified in real: no developer account."
    docs: true
  omnisign/dossierfacile:
    kind: provider
    description: "Omnisign DossierFacile: a rental applicant's file - identity, residency, activity, income, tax, guarantors, as the State checked them - shared with the application through DossierFacile Connect (OpenID Connect on DossierFacile's Keycloak): the consent page, the code exchanged and the file read and linked, the file read again with the partner's client credentials, the partner callbacks with their x-api-key checked; the three-month retention carried on the file. For partners under DossierFacile's charter."
    license: MIT
    keywords:
      - dossierfacile
      - tenant-file
      - rental
      - location
      - logement
      - oauth
      - omnisign
    repository: glitchr-omnisense/omnisign-dossierfacile
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
      - omnisense/omnisign
    verification: unverified
    verification_note: 'Not verified in real: no partner account.'
    docs: true
  omnisign/stripe-identity:
    kind: provider
    description: "Omnisign Stripe Identity: identity verification through Stripe's VerificationSessions - an identity document photographed live and a selfie matched against it, in Stripe's hosted flow or in the page; the session followed, its report read as the checks performed, cancelled, redacted; webhooks with their Stripe-Signature checked. Test mode with a test key."
    license: MIT
    keywords:
      - identity
      - identity-verification
      - kyc
      - eidas
      - stripe
      - stripe-identity
      - omnisign
    repository: glitchr-omnisense/omnisign-stripe-identity
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
      - omnisense/omnisign
    verification: unverified
    verification_note: "Not verified in real: no account. A sk_test_ key is Stripe's test mode: everything runs, nothing is really checked."
    docs: true
  omnisign/yousign:
    kind: provider
    description: "Omnisign Yousign: simple, advanced and qualified electronic signatures through Yousign's public API v3 (Youtrust since its new name) - a signature request built from documents, signers and fields, activated, followed, reminded, cancelled; signing in the application's page; the signed documents and the audit trail; webhooks with their signature checked."
    license: MIT
    keywords:
      - signature
      - e-signature
      - eidas
      - yousign
      - youtrust
      - omnisign
    repository: glitchr-omnisense/omnisign-yousign
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
      - omnisense/omnisign
    verification: partial
    verification_note: 'Documentation: the options, how an envelope becomes a signature request, levels and authentication, the webhooks, what was verified. — Not verified in real: no account.'
    docs: true
