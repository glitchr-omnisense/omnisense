# The omnilab entry of the Omniscient catalogue. Written by `bin/console
# app:catalog:import` from the packages' repositories; the phrase and the
# text are the site's own, edited here. Each package: its kind, what its
# composer.json says, its GitHub repository and development branch, whether
# its README says it was verified against the real service, whether it has
# a docs/ folder (see config/documentation.yaml).
family: omnilab
phrase:
  en: 'Read what science knows of a thing, or measures at a place.'
  fr: 'Lire ce que la science sait d’une chose, ou mesure en un lieu.'
text:
  en: "One contract for the public science-data APIs, whatever the domain: an entity (a compound, a reaction, a crystal structure, a material, a physical constant, a gene, a protein and its domains, a protein structure, a biological pathway, a disease, a genetic variant, a species, a star, a galaxy, an exoplanet, an asteroid or a comet, an earthquake, a solar flare, a rocket launch) with its properties, their units and its identifiers in other bases, followed from one base to the next; a series (a variable measured at a place, or at a weather, river or tide station, over a time: weather, climate, air, rivers, tides; a planet's or a comet's path across that place's sky); the occurrences of a place and a period (the records and observations of a species, the earthquakes of a region, the launches of a month); a catalogued product (a satellite scene; a dataset or an astronomical catalogue's table, found by text; the file of a request, followed until it is ready; STAC-like). Its sources, by domain - chemistry: PubChem, ChEBI, ChEMBL, KEGG (for academic use), Rhea's biochemical reactions, the NCI/CADD Chemical Identifier Resolver (with OPSIN for systematic names); crystals and materials: the Crystallography Open Database, the Materials Project, OQMD; physics: CODATA's fundamental constants (NIST); genes, proteins and diseases: UniProt, NCBI Gene, HGNC, Ensembl (with the plants, fungi and invertebrates of Ensembl Genomes), RCSB PDB, InterPro and Pfam, the Gene Ontology (QuickGO), STRING's protein interactions, Reactome, Open Targets' targets, diseases and drugs, ClinVar, the GWAS Catalog; the living world: NCBI Taxonomy, the Catalogue of Life (on which GBIF builds its taxonomy), GBIF, ITIS, iNaturalist, eBird (birds; a key beyond its taxonomy), the IUCN Red List (with a token); the sea: OBIS and the World Register of Marine Species (WoRMS); fossils: the Paleobiology Database; the sky: SIMBAD, NED (galaxies and quasars), the CDS's VizieR catalogues, ESA's Gaia DR3 catalogue, the NASA Exoplanet Archive; the solar system: the JPL Small-Body Database, the Minor Planet Center, JPL Horizons' ephemerides; the Earth: the earthquake catalogues of the USGS and the EMSC, Open-Meteo, NOAA (NCEI's station records, the National Weather Service), the Deutscher Wetterdienst (through Bright Sky), the Copernicus Data Space, the Copernicus Climate and Atmosphere Data Stores (C3S, CAMS), NASA Earthdata, elevations (Open Topo Data); water: the USGS's rivers and wells, NOAA's tides and water levels (CO-OPS); air: OpenAQ's measurements (with a key); space weather: NOAA's Space Weather Prediction Center (the aurora, the Kp index, the solar wind), NASA's DONKI events (flares, coronal mass ejections, storms); spaceflight: the launches of Launch Library 2; and Wikidata across them all."
  fr: "Un seul contrat pour les API scientifiques publiques, quel que soit le domaine : une entité (un composé, une réaction, une structure cristalline, un matériau, une constante physique, un gène, une protéine et ses domaines, une structure de protéine, une voie biologique, une maladie, un variant génétique, une espèce, un astre, une galaxie, une exoplanète, un astéroïde ou une comète, un séisme, une éruption solaire, un lancement de fusée) avec ses propriétés, leurs unités et ses identifiants dans d’autres bases, suivis d’une base à l’autre ; une série (une variable mesurée en un lieu, ou à une station météo, hydrométrique ou marégraphique, sur une période : météo, climat, air, rivières, marées ; la course d’une planète ou d’une comète dans le ciel de ce lieu) ; les occurrences d’un lieu et d’une période (les relevés et observations d’une espèce, les séismes d’une région, les lancements d’un mois) ; un produit catalogué (une scène satellite ; un jeu de données ou la table d’un catalogue astronomique, trouvés par texte ; le fichier d’une demande, suivie jusqu’à ce qu’il soit prêt ; au sens de STAC). Ses sources, par domaine — chimie : PubChem, ChEBI, ChEMBL, KEGG (usage académique), les réactions biochimiques de Rhea, le résolveur d’identifiants chimiques du NCI/CADD (avec OPSIN pour les noms systématiques) ; cristaux et matériaux : la Crystallography Open Database, le Materials Project, l’OQMD ; physique : les constantes fondamentales du CODATA (NIST) ; gènes, protéines et maladies : UniProt, NCBI Gene, HGNC, Ensembl (avec les plantes, champignons et invertébrés d’Ensembl Genomes), RCSB PDB, InterPro et Pfam, la Gene Ontology (QuickGO), les interactions de protéines de STRING, Reactome, les cibles, maladies et médicaments d’Open Targets, ClinVar, le GWAS Catalog ; le vivant : NCBI Taxonomy, le Catalogue of Life (sur lequel GBIF bâtit sa taxonomie), GBIF, ITIS, iNaturalist, eBird (les oiseaux ; une clé au-delà de sa taxonomie), la Liste rouge de l'UICN (avec un jeton) ; la mer : OBIS et le World Register of Marine Species (WoRMS) ; les fossiles : la Paleobiology Database ; le ciel : SIMBAD, NED (galaxies et quasars), les catalogues VizieR du CDS, le catalogue Gaia DR3 de l’ESA, l’archive des exoplanètes de la NASA ; le système solaire : la base des petits corps du JPL, le Minor Planet Center, les éphémérides de JPL Horizons ; la Terre : les catalogues des séismes de l’USGS et de l’EMSC, Open-Meteo, la NOAA (les relevés des stations du NCEI, le National Weather Service), le Deutscher Wetterdienst (par Bright Sky), le Copernicus Data Space, les entrepôts de données climat et atmosphère de Copernicus (C3S, CAMS), NASA Earthdata, les altitudes (Open Topo Data) ; l’eau : les rivières et les puits de l’USGS, les marées et niveaux d’eau de la NOAA (CO-OPS) ; l’air : les mesures d’OpenAQ (avec une clé) ; la météo de l’espace : le Space Weather Prediction Center de la NOAA (les aurores, l’indice Kp, le vent solaire), les événements DONKI de la NASA (éruptions, éjections de masse coronale, tempêtes) ; le spatial : les lancements de Launch Library 2 ; et Wikidata pour tous."
packages:
  omnilab/brightsky:
    kind: provider
    description: "Omnilab Bright Sky: the Deutscher Wetterdienst's open data through Bright Sky - hourly weather at a point or a DWD or WMO station, the observations back to 2010 joined to the MOSMIX forecasts (temperature, dew point, humidity, precipitation and its probability, pressure, wind and gusts, cloud cover, visibility, sunshine, solar irradiation), or days made from the hours; a station as an entity; no key needed."
    license: MIT
    keywords:
      - science
      - earth-sciences
      - weather
      - meteorology
      - dwd
      - bright-sky
      - mosmix
      - omnilab
    repository: glitchr-studio/omnilab-brightsky
    branch: 1.x
    requires:
      - omniscient/omnilab
    verification: unstated
    docs: true
  omnilab/cactus:
    kind: provider
    description: 'Omnilab Cactus: the NCI/CADD Chemical Identifier Resolver - a structure from a name, a CAS number, an InChIKey, an InChI or a SMILES, and its standard InChIKey, InChI, SMILES, IUPAC name, formula, molecular weight, CAS numbers, names and picture; OPSIN for a name it cannot read; no key.'
    license: MIT
    keywords:
      - science
      - chemistry
      - cactus
      - cir
      - opsin
      - inchi
      - smiles
      - omnilab
    repository: glitchr-studio/omnilab-cactus
    branch: 1.x
    requires:
      - omniscient/omnilab
    verification: unstated
    docs: true
  omnilab/cams:
    kind: provider
    description: "Omnilab CAMS: the Copernicus Atmosphere Monitoring Service's Atmosphere Data Store - its datasets (European air quality forecasts and reanalyses, global atmospheric composition, greenhouse gases, fire emissions, solar radiation) as products over a place and a period, its catalogue's search, a dataset's variables and request form, what a request would cost, read without an account; with an account's key, a request submitted and followed until its file is the product's asset. The store runs the Climate Data Store's software: omnilab/cds's source, on the ADS."
    license: MIT
    keywords:
      - science
      - atmosphere
      - air-quality
      - greenhouse-gases
      - cams
      - copernicus
      - ecmwf
      - omnilab
    repository: glitchr-studio/omnilab-cams
    branch: 1.x
    requires:
      - omnilab/cds
      - omniscient/omnilab
    verification: unstated
    docs: true
  omnilab/cds:
    kind: provider
    description: "Omnilab CDS: the Copernicus Climate Data Store - its datasets (ERA5, ERA5-Land, seasonal forecasts, climate projections, satellite and in-situ observations) as products over a place and a period, its catalogue's search, a dataset's variables and request form, what a request would cost, read without an account; with an account's key, a request submitted and followed until its file (NetCDF, GRIB, zip) is the product's asset to download. The client of ECMWF's data stores, which omnilab/cams uses for the Atmosphere Data Store."
    license: MIT
    keywords:
      - science
      - climate
      - reanalysis
      - era5
      - copernicus
      - c3s
      - ecmwf
      - omnilab
    repository: glitchr-studio/omnilab-cds
    branch: 1.x
    requires:
      - omniscient/omnilab
    verification: unstated
    docs: true
  omnilab/chebi:
    kind: provider
    description: 'Omnilab ChEBI: a chemical entity of biological interest by ChEBI id, InChIKey, CAS number, KEGG id or name - its definition, formula, masses, charge, SMILES, InChI, structure depiction, its ontology (what it is a kind of, its roles, functional parents, conjugates) and its identifiers in CAS, KEGG and the other bases - and a search, through the REST API of ChEBI 2.0 (EMBL-EBI), no key needed.'
    license: MIT
    keywords:
      - science
      - chemistry
      - chebi
      - ontology
      - ebi
      - inchikey
      - omnilab
    repository: glitchr-studio/omnilab-chebi
    branch: 1.x
    requires:
      - omniscient/omnilab
    verification: unstated
    docs: true
  omnilab/chembl:
    kind: provider
    description: "Omnilab ChEMBL: a bioactive molecule by ChEMBL id, InChIKey or name - its type, maximum development phase, computed properties (molecular weight, ALogP, polar surface area, hydrogen bond donors and acceptors, Lipinski's rule of five, QED), SMILES, InChI, structure depiction, mechanisms of action and their targets, and its identifiers in ChEBI, PubChem, UNII and DSSTox through UniChem - and a search by text or InChIKey, through the ChEMBL data web services (EMBL-EBI), no key needed."
    license: MIT
