      - omnipulse
    repository: glitchr-omnisense/omnipulse-liberapay
    branch: 1.x
    requires:
      - omnisense/contracts
      - omnisense/omnipulse
    verification: verified
    verification_note: "- Verified live without a key (2026-10-24): the Liberapay team's profile."
    docs: true
  omnipulse/matomo:
    kind: provider
    description: "Omnipulse's Matomo, under any PHP host: visits, visitors, pageviews, bounce rate and visit length of a site, by entry page, page, referrer, country, device or day, through Matomo's Reporting API (self-hosted or Matomo Cloud), the token sent by POST."
