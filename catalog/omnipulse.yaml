# The omnipulse entry of the Omnisense catalogue. Written by `bin/console
# app:catalog:import` from the packages' repositories; the phrase and the
# text are the site's own, edited here. Each package: its kind, what its
# composer.json says, its GitHub repository and development branch, whether
# its README says it was verified against the real service, whether it has
# a docs/ folder (see config/documentation.yaml).
family: omnipulse
phrase:
  en: 'Audience, reviews and funding: the pulse of a site or project.'
  fr: 'Audience, avis et financement : le pouls d’un site ou d’un projet.'
text:
  en: 'One contract for what outside platforms know of a site or a project: its audience (search queries, pages, visits, sources), its reviews (rating, reviews, replies, invitations, each platform’s terms of display) and its funding (profile, sponsors, tiers).'
  fr: 'Un seul contrat pour ce que les plateformes extérieures savent d’un site ou d’un projet : son audience (requêtes, pages, visites, sources), ses avis (note, avis, réponses, invitations, les conditions d’affichage de chaque plateforme) et son financement (profil, soutiens, paliers).'
packages:
  omnipulse/bing-webmaster:
    kind: provider
    description: "Omnipulse's Bing Webmaster Tools, under any PHP host: a site's search queries and pages in Bing with their clicks, impressions, CTR and average position, week by week or over a period, through the Bing Webmaster API (JSON, API key)."
    license: MIT
    keywords:
      - bing
      - bing-webmaster
      - seo
      - search
      - queries
      - positions
      - framework-agnostic
      - omnipulse
    repository: glitchr-omnisense/omnipulse-bing-webmaster
    branch: 1.x
    requires:
      - omnisense/contracts
      - omnisense/omnipulse
    verification: partial
    verification_note: 'Positions are passed as Bing gives them (not verified against a live account).'
    docs: true
  omnipulse/ga4:
    kind: provider
    description: "Omnipulse's Google Analytics 4, under any PHP host: visitors, sessions, pageviews, bounce rate and session length of a property, by landing page, page, source, country, device or day, through the Google Analytics Data API (runReport; a service account's key or an access token)."
    license: MIT
    keywords:
      - google
      - google-analytics
      - ga4
      - analytics
      - audience
      - data-api
      - framework-agnostic
      - omnipulse
    repository: glitchr-omnisense/omnipulse-ga4
    branch: 1.x
    requires:
      - omnisense/contracts
      - omnisense/omnipulse
    verification: partial
    verification_note: '- Not verified live: no Google account was used.'
    docs: true
  omnipulse/github-sponsors:
    kind: provider
    description: "Omnipulse's GitHub Sponsors, under any PHP host: a user's or an organization's listing read through GitHub's GraphQL API - its page, its goal, its tiers, the number of sponsors and the public ones."
    license: MIT
    keywords:
      - sponsors
      - github-sponsors
      - github
      - graphql
      - funding
      - framework-agnostic
      - omnipulse
    repository: glitchr-omnisense/omnipulse-github-sponsors
    branch: 1.x
    requires:
      - omnisense/contracts
      - omnisense/omnipulse
    verification: partial
    verification_note: "- Verified live (2026-10-24, a token): glitchr-studio's listing; sindresorhus's tiers and two sponsors. — - Not verified live: an active goal (none at hand)."
    docs: true
  omnipulse/google-reviews:
    kind: provider
    description: "Omnipulse's Google reviews: an establishment's Google rating and reviews through the Places API (New) - up to five, with their authors' attribution - and, for its owner, every review and replying through the Business Profile API; the link to leave a review; Google's display and caching rules declared."
    license: MIT
    keywords:
      - reviews
      - google-reviews
      - places-api
      - business-profile
      - omnipulse
    repository: glitchr-omnisense/omnipulse-google-reviews
    branch: 1.x
    requires:
      - omnisense/contracts
      - omnisense/omnipulse
    verification: partial
    verification_note: "Documentation: the options, the calls, Google's terms, what was verified. — Not verified in real: no key - but for the link to write a review, which answered."
    docs: true
  omnipulse/liberapay:
    kind: provider
    description: "Omnipulse's Liberapay, under any PHP host: an account's public profile read from Liberapay's public.json - patrons counted, weekly income, goal, summary (no key; Liberapay keeps patrons and tiers private)."
    license: MIT
    keywords:
