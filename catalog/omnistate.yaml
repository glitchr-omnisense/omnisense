# The omnistate entry of the Omnisense catalogue. Written by `bin/console
# app:catalog:import` from the packages' repositories; the phrase and the
# text are the site's own, edited here. Each package: its kind, what its
# composer.json says, its GitHub repository and development branch, its
# latest stable release on Packagist (`version`, none when nothing is tagged)
# and whether it is abandoned, whether its README says it was verified against
# the real service, whether it has a docs/ folder (see config/documentation.yaml).
family: omnistate
phrase:
  en: 'Ask the public registers what they know.'
  fr: 'Demander aux registres publics ce qu’ils savent.'
text:
  en: 'One contract for what states and registries know: companies, VAT numbers, domains and networks, and the registers its providers add.'
  fr: 'Un seul contrat pour ce que savent les États et les registres : entreprises, numéros de TVA, noms de domaine et réseaux, et les registres que ses fournisseurs ajoutent.'
packages:
  omnisense/omnistate:
    kind: family
    description: "Omnistate: one contract for what states and registries know - companies, VAT numbers, domains and networks, professionals, civil records, public statistics (the Omnipay of public registers), each register's usage policy enforced."
    license: MIT
    keywords:
      - company
      - registry
      - statistics
      - sdmx
      - insee
      - eurostat
      - ecb
      - irl
      - siren
      - siret
      - vat
      - vies
      - rdap
      - iana
      - kyc
      - 'civil registry'
      - genealogy
    repository: glitchr-omnisense/omnistate
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
    verification: unstated
    docs: true
  omnistate/annuaire-entreprises:
    kind: provider
    description: "Omnistate Annuaire des Entreprises: French companies from the State's Recherche d'entreprises API (INSEE Sirene + INPI's RNE) - free, no key."
    license: MIT
    keywords:
      - siren
      - siret
      - sirene
      - rne
      - insee
      - inpi
      - france
      - company
      - omnistate
    repository: glitchr-omnisense/omnistate-annuaire-entreprises
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
      - omnisense/omnistate
    verification: unstated
    docs: true
  omnistate/annuaire-sante:
    kind: provider
    description: "Omnistate Annuaire Santé: French health professionals (RPPS: profession, specialties, workplaces, MSSanté addresses) and facilities (FINESS) from the ANS's FHIR API."
    license: MIT
    keywords:
      - rpps
      - finess
      - 'annuaire sante'
      - ans
      - fhir
      - mssante
      - health
      - france
      - omnistate
    repository: glitchr-omnisense/omnistate-annuaire-sante
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
      - omnisense/omnistate
    verification: unstated
    docs: true
  omnistate/ecb:
    kind: provider
    description: "Omnistate ECB: the European Central Bank's statistics from its Data Portal's SDMX web service (no key) - euro foreign exchange reference rates, key interest rates, every series by its dataflow and key."
    license: MIT
    keywords:
      - ecb
      - 'european central bank'
      - sdmx
      - statistics
      - 'exchange rates'
      - 'interest rates'
      - euro
      - omnistate
    repository: glitchr-omnisense/omnistate-ecb
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
      - omnisense/omnistate
    verification: unstated
    docs: true
  omnistate/eurostat:
    kind: provider
    description: "Omnistate Eurostat: European statistics from Eurostat's dissemination API (JSON-stat 2.0, no key) - a dataset's series by its filters, its flags (provisional, estimated, break), the catalogue searched."
    license: MIT
    keywords:
      - eurostat
      - json-stat
      - sdmx
      - statistics
      - hicp
      - inflation
      - gdp
      - eu
      - omnistate
    repository: glitchr-omnisense/omnistate-eurostat
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
      - omnisense/omnistate
    verification: unstated
    docs: true
  omnistate/iana:
    kind: provider
    description: "Omnistate IANA: domains, IP addresses and AS numbers through IANA's RDAP bootstrap - the registrar, the dates, the name servers, who holds a network. Free, no key."
    license: MIT
    keywords:
      - rdap
      - iana
      - whois
      - domain
      - ip
      - asn
      - registrar
      - omnistate
    repository: glitchr-omnisense/omnistate-iana
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
      - omnisense/omnistate
    verification: unstated
    docs: true
  omnistate/insee:
    kind: provider
    description: "Omnistate INSEE: French statistics from INSEE's macro-economic database (BDM, SDMX 2.1, no key) - the indices leases refer to (IRL, ICC, ILC, ILAT), consumer prices, every series by its idBank, with its revisions."
    license: MIT
    keywords:
      - insee
      - bdm
      - sdmx
      - statistics
      - irl
      - 'indice de reference des loyers'
      - icc
      - ilc
      - ilat
      - ipc
      - omnistate
    repository: glitchr-omnisense/omnistate-insee
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
      - omnisense/omnistate
    verification: unstated
    docs: true
  omnistate/matchid:
    kind: provider
    description: "Omnistate matchID: France's deaths since 1970 (INSEE's file of deceased persons) searched through deces.matchid.io - names, birth, death, the act's number."
    license: MIT
    keywords:
      - genealogy
      - 'civil registry'
      - 'etat civil'
      - deces
      - insee
      - matchid
      - france
      - omnistate
    repository: glitchr-omnisense/omnistate-matchid
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
      - omnisense/omnistate
    verification: unstated
    docs: true
  omnistate/nara:
    kind: provider
    description: 'Omnistate NARA: the National Archives Catalog of the United States (Catalog API v2) - federal files that name a person (pension files, military service records, draft cards, naturalization indexes), with their reference and links to their scanned pages. A catalogue, not civil registration; an API key is needed.'
    license: MIT
    keywords:
      - genealogy
      - archives
      - 'national archives'
      - nara
      - 'united states'
      - catalog
      - omnistate
    repository: glitchr-omnisense/omnistate-nara
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
      - omnisense/omnistate
    verification: unstated
    docs: true
  omnistate/national-archives-uk:
    kind: provider
    description: "Omnistate National Archives UK: the Discovery catalogue of the UK's National Archives and 2,500 other archives - documents that name a person (wills, service records, parish papers), with their reference. A catalogue, not civil registration."
    license: MIT
    keywords:
      - genealogy
      - archives
      - 'national archives'
      - discovery
      - 'united kingdom'
      - catalogue
      - omnistate
    repository: glitchr-omnisense/omnistate-national-archives-uk
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
      - omnisense/omnistate
    verification: unstated
    docs: true
  omnistate/openarchieven:
    kind: provider
    description: "Omnistate Open Archives: births, baptisms, marriages, deaths, burials and more from the indexes of Dutch and Belgian archives (openarchieven.nl), with the archive's reference and the scan of the act."
    license: MIT
    keywords:
      - genealogy
      - 'civil registry'
      - 'burgerlijke stand'
      - 'open archives'
      - openarchieven
      - a2a
      - netherlands
      - belgium
      - omnistate
    repository: glitchr-omnisense/omnistate-openarchieven
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
      - omnisense/omnistate
    verification: unstated
    docs: true
  omnistate/vies:
    kind: provider
    description: "Omnistate VIES: EU VAT numbers checked with the European Commission's VIES (REST - no SOAP extension needed), with a consultation number as proof."
    license: MIT
    keywords:
      - vat
      - vies
      - eu
      - intra-community
      - 'reverse charge'
      - omnistate
    repository: glitchr-omnisense/omnistate-vies
    branch: 1.x
    version: 1.0.0
    requires:
      - omnisense/contracts
      - omnisense/omnistate
    verification: unstated
    docs: true
