  omnishow/wikidata:
    kind: provider
    description: "Omnishow's Wikidata, under any PHP host: films, series and episodes from Wikidata's open records (CC0) through the MediaWiki API, with no key - a search narrowed to works on the server, a work by its Q-number or by its IMDb, TMDB or TheTVDB identifier, its genres, cast and crew labelled in the language asked, its poster from Wikimedia Commons; the User-Agent and maxlag Wikimedia's policies ask."
    license: MIT
    keywords:
      - wikidata
