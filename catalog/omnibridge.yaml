# The omnibridge entry of the Omnisense catalogue. Written by `bin/console
# app:catalog:import` from the packages' repositories; the phrase and the
# text are the site's own, edited here. Each package: its kind, what its
# composer.json says, its GitHub repository and development branch, its
# latest stable release on Packagist (`version`, none when nothing is tagged)
# and whether it is abandoned, whether its README says it was verified against
# the real service, whether it has a docs/ folder (see config/documentation.yaml).
family: omnibridge
phrase:
  en: 'The glue between the foundation and a framework, a storage, a view layer or a static host.'
  fr: 'La colle entre le socle et un cadre, un stockage, une couche de rendu ou un hébergement statique.'
packages:
  omnibridge/composer:
    kind: bridge
    description: 'A Composer plugin that knows no package: the patches and the stub providers the installed packages declare in extra.omnibridge, applied after install and update, restored when they no longer apply, recorded with checksums and checked in CI.'
    license: MIT
    keywords:
      - composer
      - plugin
      - patch
      - stub
      - omnibridge
    repository: glitchr-omnisense/omnibridge-composer
    branch: 1.x
    version: 1.0.0
    verification: unstated
    docs: true
  omnibridge/doctrine:
    kind: bridge
    description: "omnibase's persistence on Doctrine, and the storage glue of omnibase sites, framework-free: Doctrine reading the structure described outside of it (omnisense/omnibridge's schema), the naming strategy, the UTC date types, an entity manager built with them; behind the core's contracts, the compiler of the finder language, the statements of the backend-only queries and the mapping. It declares no repository: the core's repositories are the same on every persistence. The Doctrine classes a host's configuration names are declared under the core's own namespace."
    license: MIT
    repository: glitchr-omnisense/omnibridge-doctrine
    branch: 4.x
    version: 4.0.0
    requires:
      - omnisense/omnibridge
    verification: unstated
    docs: true
  omnibridge/eloquent:
    kind: bridge
    description: "omnibase's persistence on Eloquent's database layer, framework-free: illuminate/database (Laravel's connection, or Capsule outside Laravel) reading the tables omnisense/omnibridge's schema describes into the same plain PHP entities any other persistence maps - a data mapper: tables from the description, a hydrator with PHP 8.4 lazy ghosts and lazy collections, an identity map, casts; behind the core's contracts, the compiler of the finder language, the statements of the backend-only queries, the unit of work and its lifecycle. It declares no repository: Base\\Repository\\* are the core's, the same on every persistence."
    license: MIT
    keywords:
      - omnibridge
      - omnibase
      - eloquent
      - data-mapper
      - framework-agnostic
    repository: glitchr-omnisense/omnibridge-eloquent
    branch: 2.x
    version: 2.1.0
    requires:
      - omnisense/omnibridge
    verification: unstated
    docs: true
  omnibridge/laravel:
    kind: bridge
    description: 'The Laravel host of omnisense/omnibase: its Foundation contracts (urls, translations, locales, access, parameters with the database settings laid over Laravel''s config, clock, events...) answered by Laravel''s services and seeded in Base\Contract\Runtime, the persistence through omnibridge/eloquent or omnibridge/doctrine, Twig through omnibridge/twig, and the pieces an omnibase page asks of its framework (Encore tags, the app variable, simple forms).'
    license: MIT
    keywords:
      - laravel
      - omnibase
      - omnibridge
      - twig
      - doctrine
    repository: glitchr-omnisense/omnibridge-laravel
    branch: 2.x
    version: 2.0.2
    requires:
      - omnibridge/twig
      - omnisense/omnibase
      - omnisense/omnibridge
    verification: unstated
    docs: true
  omnibridge/react:
    kind: bridge
    description: "A page of a site as a React component and its props, the same from any framework: the first visit an HTML shell holding the page, a visit within the site the page in JSON (header X-Omnibridge), the JavaScript side rendering it and following the site's links without reloading."
    license: MIT
    keywords:
      - omnibridge
      - react
      - symfony
      - laravel
      - framework-agnostic
    repository: glitchr-omnisense/omnibridge-react
    branch: 1.x
    version: 1.0.0
    verification: unstated
    docs: true
  omnibridge/static:
    kind: bridge
    description: "The static host of the omnibridge family: a generic exporter that enumerates an application's addresses (explicit lists, a router's #[Route] routes with the values of their parameters, a sitemap), renders each at build time by the application's own code (its host's request handling, its actions, or any callable), and writes a deterministic folder for a static host or a CDN - HTML pages, the files of an asset manifest (Vite, Webpack), the files the pages refer to, redirections, 404.html, sitemap.xml and a report with checksums and diagnostics (broken links, duplicate outputs, missing assets, non-deterministic pages). No framework, no bundler."
    license: MIT
    keywords:
      - omnibridge
      - static-site
      - export
      - framework-agnostic
      - symfony
      - laravel
    repository: glitchr-omnisense/omnibridge-static
    branch: 1.x
    version: 1.1.0
    verification: partial
    verification_note: 'Not done, or not verified:'
    docs: true
  omnibridge/symfony:
    kind: bridge
    description: 'The Symfony host of omnisense/omnibase: what is Symfony by nature in omnibase, declared under its Base\ names (Base\BaseBundle, the security glue, the form and field types, the controllers, the console commands, the kernel subscribers, the DI passes, the router), the adapters of omnisense/omnibridge''s contracts over Symfony''s services, and the framework packages the core does not require. A Symfony site requires it beside the core and names Base\ only.'
    license: MIT
    keywords:
      - omnibase
      - omnibridge
      - symfony
    repository: glitchr-omnisense/omnibridge-symfony
    branch: 3.x
    version: 3.1.1
    requires:
      - omnibridge/twig
      - omnisense/omnibridge
    verification: unstated
    docs: true
  omnibridge/twig:
    kind: bridge
    description: "The Twig side of omnibridge: the contract a page rendered with Twig asks of any framework (path, url, asset, trans - omnisense/omnibridge's Urls and Translations), the Twig extension that provides it where the framework does not, and helpers."
    license: MIT
    repository: glitchr-omnisense/omnibridge-twig
    branch: 2.x
    version: 2.0.0
    requires:
      - omnisense/omnibridge
    verification: unstated
    docs: true
  omnisense/omnibridge:
    kind: bridge
    description: "The core of the omnibridge family: the contracts any host answers for an application that runs on more than one framework (addresses, translations, languages, access, sessions, tokens, stored files, routes, environment) and the registry the application reaches them through. No framework, no ORM: each omnibridge/<host> bridge answers them with its host's services."
    license: MIT
    keywords:
      - omnibridge
      - contracts
      - framework-agnostic
      - symfony
      - laravel
    repository: glitchr-omnisense/omnibridge
    branch: 2.x
    version: 2.0.1
    verification: unstated
    docs: true
