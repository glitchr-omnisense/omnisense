# The omnisong entry of the Omniscient catalogue. Written by `bin/console
# app:catalog:import` from the packages' repositories; the phrase and the
# text are the site's own, edited here. Each package: its kind, what its
# composer.json says, its GitHub repository and development branch, whether
# its README says it was verified against the real service, whether it has
# a docs/ folder (see config/documentation.yaml).
family: omnisong
phrase:
  en: "Let a musician's catalogue be heard."
  fr: 'Faire écouter le catalogue d’un musicien.'
text:
  en: 'One contract for listening to a catalogue: releases, tracks, previews, the links to every platform, and the embeds that play from them.'
  fr: 'Un seul contrat pour écouter un catalogue : disques, plages, extraits, les liens vers chaque plateforme, et les lecteurs qui les jouent.'
packages:
  omniscient/omnisong:
    kind: family
    description: "Omnisong: one contract for listening to a musician's catalogue - releases, tracks, previews, the links to every platform with the label first, and the embeds that play from them - and its Symfony bundle."
    license: MIT
    keywords:
      - music
      - discography
      - smart-links
      - odesli
      - itunes
      - player
      - omnisong
    repository: glitchr-studio/omnisong
    branch: 1.x
    verification: unstated
    docs: true
  omnisong/itunes:
    kind: provider
    description: "Omnisong iTunes: an artist's albums and tracks with their 30-second previews and artwork, through the iTunes Search API - no key."
    license: MIT
    keywords:
      - music
      - itunes
      - apple-music
      - preview
      - omnisong
    repository: glitchr-studio/omnisong-itunes
    branch: 1.x
    requires:
      - omniscient/omnisong
    verification: unstated
  omnisong/odesli:
    kind: provider
    description: "Omnisong Odesli: one link (or an ISRC, a UPC) to the same song or album on every platform, through song.link's API."
    license: MIT
    keywords:
      - music
      - odesli
      - songlink
      - omnisong
    repository: glitchr-studio/omnisong-odesli
    branch: 1.x
    requires:
      - omniscient/omnisong
    verification: unstated
