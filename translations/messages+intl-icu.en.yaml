floors:
  eyebrow: The foundation
  title: The core, the families, the bridges
  lead: 'What any site may take: omnibase, the core of the sites; the families, one contract per domain, fulfilled service by service by their providers; the bridges, which tie it all to a framework. The providers are not listed here: they are searched for.'
  packages: '{count, plural, one {package} other {packages}}'
  note: 'A site takes the core, the families it calls on and the bridges of its framework. A prepared structure is added when it saves time: nothing in the core or the families depends on one.'
  libraries: Plus <a href="{url}">{count, plural, one {# JavaScript library} other {# JavaScript libraries}}</a>.
  foundation:
    name: Core
    one: Core
    pattern: omnisense/omnibase
    text: 'The core every site starts from: accounts and security, back office, translations, images, forms.'
  component:
    name: Prepared structures
    one: Prepared structure
    pattern: omnibase/<trade>
    text: 'A ready-made structure for one trade - entities, screens, back office, translations, demo data - already assembled on the core. Optional: take one to go fast, or write your own on the core and the families.'
  family:
    name: Families
    one: Family
    pattern: omnisense/omni<domain>
    text: The contract of one domain - parcels, payments, public registers, science data - in plain PHP, whoever the service behind it. Under omnisense/, or still glitchr/ for those not moved yet.
  provider:
    name: Providers
    one: Provider
    pattern: omni<domain>/<service>
    text: 'A service fulfilling its family''s contract: one package per service, installed on its own.'
  bridge:
    name: Bridges
    one: Bridge
    pattern: omnibridge/<target>
    text: 'The glue between the core and a framework, a storage or a view layer. It knows no structure: one bridge serves them all.'
  library:
    name: Libraries
    one: Library
    pattern: '@glitchr/<name>'
    text: The house's JavaScript libraries, without dependency.
  providers_count: '{count, plural, =0 {no provider} one {# provider to search} other {# providers to search}}'
