policies:
  title: Usage policies
  description: 'Every provider of the Omni ecosystem and its usage policy: access, limits, commercial use, caching, storage, credit - {declared} declared by the providers’ own packages.'
  lead: 'Each provider declares its rules as data, in its package: what it takes to call the API, its limits, what its terms allow, the credit to show, who read them and when. A site that installs the package is held to them; this table shows them all.'
  source: '{declared} declared by the packages (their policy.json, at their published head), {typed} read by this site on the pages of providers not built yet, {none} not declared yet. Unknown is shown as unknown, never as allowed.'
  to_declare: Declare a policy →
  search: Search the providers
  placeholder: 'google, holidays, forbidden…'
  count: 'Providers: {providers}'
  provider: Provider
  sources: Read at
  notes: The maintainer’s notes
contribute:
  eyebrow: Contribute
  title: Maintain a provider, or bring your API
  description: 'How a provider of the Omni ecosystem is built, proposed, reviewed and maintained; how a company declares its API’s usage policy; the families and providers wanted.'
  lead: 'No single team can follow every API. Each provider is a small package of its own, under one family’s contract; it lives best with a named maintainer, and with the company that runs the API looking over it.'
  dev:
    title: For developers
    lead: 'A provider implements one family’s contract for one service, and nothing else.'
    template: Start from the template
    template_text: '<a href="https://github.com/glitchr-omnisense/omni-provider-template">omni-provider-template</a> has a skeleton per family; <code>bin/init &lt;family&gt; &lt;service&gt;</code> fills the names, and its suite is green before a line is written.'
    declarative: Or declare it as data
    declarative_text: 'A service that answers one plain HTTP call per question can be a provider without code: a data file that names its endpoints and maps its answers onto the family’s models, loaded by the family itself. omnical’s Nager.Date and OpenHolidays are written that way - <a href="{url}">a provider as a data file</a>.'
    policy: Declare its usage policy
    policy_text: 'Every provider ships a <code>policy.json</code>: its limits, what its terms allow (commercial use, caching, storage, redistribution), the credit to show, what a request must carry, and where and when the terms were read. A site that installs it is held to it, and the <a href="{url}">declaration</a> is checked against omnisense/contracts’ schema.'
    suite: Run the family’s conformance suite
    suite_text: 'Each core ships its suite as a PHPUnit trait (<code>&lt;Core&gt;\Testing</code>). The provider is built over recorded answers (<code>MockHttpClient</code>): the suite never reaches the network.'
    bare: Prove it runs outside any framework
    bare_text: '<code>Tests/BareTest.php</code> loads every class with the package’s own requirements; no framework in <code>require</code>, an HTTP client always accepted from outside.'
    ci: Keep the CI green
    ci_text: 'The skeleton’s workflows call <a href="https://github.com/glitchr-studio/ci">glitchr-studio/ci</a>, pinned to a commit: tests on each push, a release with its notes, its archive checksum and a provenance attestation on each tag.'
    propose: Propose it
    propose_text: 'Open a “Provider” issue: the family, the service, its usage policy, what can be checked live. The name is agreed there, then the repository is created under glitchr-omnisense.'
    model: Who maintains what
    model_repo: 'Every provider repository lives under the glitchr-omnisense organisation, MIT licensed, so that it outlives any one person’s availability.'
    model_maintainer: 'Each provider names its maintainer in its README and in CODEOWNERS; a company that runs the API can be a co-maintainer.'
    model_review: 'A change is merged after the review of the family’s maintainer and a green CI that runs the conformance suite; a change to a family’s contract needs the family’s maintainer, never a provider alone.'
    model_release: 'The README’s “Verified, and not” says what was tried against the real service and when; the catalogue shows it as it is written.'
    model_leave: 'A maintainer who steps back says so in an issue; the provider is marked “help wanted” until someone takes it over.'
    cta: Propose a provider
    guide: Read “Writing a provider”
  company:
    title: For the companies behind the APIs
    lead: 'An integration you have read is one your users can trust. Three ways in, from an hour to an ongoing role.'
    review: Review your provider
    review_text: 'Read the package that calls your API: the endpoints, the errors it maps, the limits it respects. An issue or a pull request is enough.'
    policy: Declare your usage policy as data
    policy_text: 'Each provider carries its policy as data, in its own <code>policy.json</code>: the limits, the rights (commercial use, caching, storage, redistribution), the credit to show, what every request must carry, who read the terms and when. An application is held to it before it calls you; a site may only make it stricter. <a href="{url}">Declare your policy</a>, <a href="{limits}">set your limits</a>, and see <a href="{table}">every policy declared</a>.'
    comaintain: Co-maintain it
    comaintain_text: 'Be named in its CODEOWNERS: your changes to the API reach the package when they ship, not when a user notices.'
    listed: Be listed
    listed_text: 'Your API gets its card in the catalogue, with your policy and a link to your terms; a reviewed provider says so.'
    cta: Review or declare your API
    see: Every usage policy
