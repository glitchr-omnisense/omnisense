privacy:
  title: Privacy
  intro: 'This site is a set of static pages: no account, no form, no tracking, no cookie.'
  cookies: Cookies and storage
  cookies_text: No cookie is set. The choice between light and dark, if you make one, is kept in your own browser (local storage) and never leaves it.
  services: Services asked
  services_text: 'The pages load nothing from other services: the fonts and scripts are the site''s own. Links to GitHub, Packagist or npm take you there; nothing is asked of them while you read.'
  host: The host
  host_text: 'The pages are served by {host} (GitHub, Inc.), which records each visitor''s IP address for the security of its service, as its privacy statement says. The site itself receives none of it.'
  rights: Your rights
  rights_text: 'The site keeps no personal data. For any question: {email}.'
