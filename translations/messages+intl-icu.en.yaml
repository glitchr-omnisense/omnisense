compat:
  eyebrow: "Compatibility"
  title: "Compatible with any framework: the families today, the foundation tomorrow"
  lead: "What is true today, and what will be. No date: the foundation's work comes after the sites in progress."
  now: "Today"
  later: "Planned"
  families_title: "The families run in plain PHP"
  families_text: "The core of an <code>omni*</code> family requires neither Symfony, nor Doctrine, nor Twig: only standalone libraries. Its registry is built by hand, in a script, a Laravel or a Symfony application. The Symfony bridge is in the package, under <code>Bridge/Symfony</code>, and nothing of it is loaded elsewhere."
  families_proof: "The proof: each family has a framework-free test (<code>Tests/BareTest.php</code>) that builds its registry by hand and checks that no framework class is loaded."
  omnibase_title: "omnibase is made for Symfony"
  omnibase_text: "<code>glitchr/omnibase</code> and its <code>omnibase/*</code> components are Symfony bundles today: their screens, storage and templates rely on Symfony, Doctrine and Twig."
  agnostic_title: "omnibase will become agnostic"
  agnostic_text: "Each component's trade will move to the root of its package (objects, rules, contracts), its framework parts into bridges of the same package (<code>Bridge/Symfony</code>, <code>Bridge/Doctrine</code>, <code>Bridge/Twig</code>). A generic glue, which knows no component, will tie them to each framework:"
  bridge_symfony: "container, routing, forms, security"
  bridge_doctrine: "storage (Doctrine is standalone)"
  bridge_twig: "rendering (Twig is standalone)"
  bridge_composer: "installation, today glitchr/base-plugin"
  bridge_laravel: "when someone uses it"
  read_more: "The detail, and what it asks of each package: <a href=\"{url}\">the Compatibility page of the documentation</a>."

