compat:
  eyebrow: Compatibility
  title: 'Any framework: the families in plain PHP, the core through its bridges'
  lead: What is true today. No date is promised for the rest.
  now: Today
  later: Next
  families_title: The families run in plain PHP
  families_text: 'The core of an <code>omni*</code> family requires neither Symfony, nor Doctrine, nor Twig: only standalone libraries. Its registry is built by hand, in a script, a Laravel or a Symfony application. The Symfony bridge is in the package, under <code>Bridge/Symfony</code>, and nothing of it is loaded elsewhere.'
  families_proof: 'The proof: each family has a framework-free test (<code>Tests/BareTest.php</code>) that builds its registry by hand and checks that no framework class is loaded.'
  omnibase_title: omnibase 4 runs through its bridges
  omnibase_text: '<code>omnisense/omnibase</code> 4.x requires only its framework-free foundation: Symfony comes through <code>omnibridge/symfony</code>, Laravel through <code>omnibridge/laravel</code>, the storage and the rendering through <code>omnibridge/doctrine</code> and <code>omnibridge/twig</code>.'
  agnostic_title: The prepared structures follow
  agnostic_text: 'The prepared structures <code>omnibase/*</code> are Symfony bundles on the core today; each moves its trade to the root of its package (objects, rules, contracts) as it is reworked, its framework parts into bridges. The generic glue, which knows no structure:'
  bridge_symfony: container, routing, forms, security
  bridge_doctrine: storage (Doctrine is standalone)
  bridge_twig: rendering (Twig is standalone)
  bridge_composer: 'installation: the stubs and the core’s declared patches'
  bridge_laravel: the core’s contracts on Laravel’s container
  read_more: 'The detail, and what it asks of each package: <a href="{url}">the Compatibility page of the documentation</a>.'
  bridges_below: That glue is <a href="{url}">omnibridge</a>, described above.
