floors:
  eyebrow: "Section"
  title: "Four floors, two buildings"
  lead: "On the left, what a site is made of. On the right, what it asks of the outside. Neither owes the other anything: a family also works without the foundation."
  stack_house: "What a site is made of"
  stack_outside: "What a site asks of the outside"
  packages: "{count, plural, one {package} other {packages}}"
  note: "A site takes the foundation, the trades it needs, and the families those trades ask."
  libraries: "Plus <a href=\"{url}\">{count, plural, one {# JavaScript library} other {# JavaScript libraries}}</a>."
  foundation:
    name: "Foundation"
    one: "Foundation"
    pattern: "glitchr/omnibase"
    text: "What every site starts from: accounts, back office, translations, images, forms. Made for Symfony."
  component:
    name: "Trades"
    one: "Trade"
    pattern: "omnibase/<trade>"
    text: "One site component per trade: shop, blog, agenda, practice, restaurant. It sets its pages and screens on the foundation."
  family:
    name: "Families"
    one: "Family"
    pattern: "glitchr/omni<question>"
    text: "One question asked of several services, one contract for the answer. No framework: plain PHP, Symfony as an option."
  provider:
    name: "Providers"
    one: "Provider"
    pattern: "omni<question>/<service>"
    text: "A service that answers the question: one package per service, installed on its own."
  library:
    name: "Libraries"
    one: "Library"
    pattern: "@glitchr/<name>"
    text: "The house's JavaScript libraries, without dependency."

families:
  omnibase:
    phrase: "The foundation of the sites, and one component per trade."
    text: "glitchr/omnibase is made for Symfony: accounts and security, back office, translations, images, forms. Each omnibase/<trade> adds the pages and screens of one trade; a site composes the ones it needs."
  omnibus:
    phrase: "Ship a parcel, whatever the carrier."
    text: "One contract for parcel carriers: rates, labels, tracking, pickup points."
  omnitrade:
    phrase: "Take payments and sell, whatever the provider."
    text: "One contract for payment providers and commerce platforms: purchase, authorize, capture, refund, webhooks, platform orders."
  omnistate:
    phrase: "Ask the public registers what they know."
    text: "One contract for what states and registries know: companies, VAT numbers, domains and networks, and the registers its providers add."
  omnibank:
    phrase: "Read a bank account."
    text: "One contract for bank access: accounts, balances, transactions, transfers, consents and webhooks, over statement files and bank APIs."
  omnisong:
    phrase: "Let a musician's catalogue be heard."
    text: "One contract for listening to a catalogue: releases, tracks, previews, the links to every platform, and the embeds that play from them."
  omnipost:
    phrase: "Publish on the social networks."
    text: "One contract for publishing - a reel, a picture, a carousel -, reading one's own feed, and knowing what each network imposes."
  omnifood:
    phrase: "Receive a restaurant's orders and reservations."
    text: "One contract for the restaurant platforms: delivery orders, table reservations, menus, stores, webhooks."
  omnischolar:
    phrase: "Gather a researcher's publications."
    text: "One contract for publications: author profiles, works, books and their editions, citations, read from several sources, merged and deduplicated, exported as BibTeX, RIS or CSL-JSON."
  omnilab:
    phrase: "Read what science knows of a thing, or measures at a place."
    text: "One contract for the public science-data APIs, whatever the domain: an entity (a compound, a gene, a protein structure, a species, a star, an earthquake) with its properties, their units and its identifiers in other bases, followed from one base to the next; a series (a variable measured at a place over a time: weather, climate, air); the occurrences of a place and a period (the records and observations of a species, the earthquakes of a region); a catalogued product (a satellite scene, STAC-like) - PubChem, ChEBI, ChEMBL, Wikidata, UniProt, NCBI Gene and Taxonomy, Ensembl, RCSB PDB, GBIF, iNaturalist, SIMBAD, the JPL Small-Body Database, the USGS earthquake catalogue, Open-Meteo, the Copernicus Data Space."
  omnilex:
    phrase: "Read the sources of law."
    text: "One contract for the sources of law: texts, codes and case law, searched with filters, read in the version in force at a date; identifiers normalised and validated (ECLI, NOR, CELEX)."
  omnimeet:
    phrase: "Open a video room and let someone in."
    text: "One contract for video meetings: open a room, let a participant in, close it, read its state - whether the call goes from browser to browser or through a conferencing service."
  omnishield:
    phrase: "Guard a form: captcha, spam, addresses known for abuse."
    text: "One contract for guarding a form: is this token valid (ALTCHA, Turnstile, reCAPTCHA), is this text spam (Akismet), is this address known for abuse (StopForumSpam, disposable domains) - whoever answers; a form field and a constraint on the Symfony side."
  omnishow:
    phrase: "Play a video hosted elsewhere."
  omnisign:
    phrase: "Have a document signed."
    text: "One contract for having documents signed: create an envelope (documents, signers, fields, a simple, advanced or qualified level), send it, follow it, remind, cancel, sign in the page, download the signed documents and their evidence - Yousign, DocuSign, DocuSeal."
  omnibill:
    phrase: "Send and receive an electronic invoice."
    text: "One contract for electronic invoices: submit a conformant file (Factur-X, UBL, CII), follow its statuses, receive suppliers' invoices, declare a status, look a company up in the directory, transmit e-reporting - by e-mail, through an approved platform (XP Z12-013) or Chorus Pro."
  omnireview:
    phrase: "Read what customers say elsewhere."
    text: "One contract for what customers say elsewhere: the rating, the reviews, the establishment's reply, the invitation to leave a review - Google, Tripadvisor, Trustpilot -, each platform with its terms of display; the origin, the date and the link always shown."
  omniticket:
    phrase: "Read the tickets sold elsewhere."
  omnireach:
    phrase: "Read what outside tools know of a site's audience."
  omnifilm:
    phrase: "Describe a work: film, series, episode."
  omnigame:
    phrase: "Follow a game on the stores."
  omnidns:
    phrase: "Manage a domain name where it is registered."

