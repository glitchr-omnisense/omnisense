contribute:
  eyebrow: Contribuer
  title: Maintenir un fournisseur, ou apporter son API
  description: 'Comment un fournisseur de l’écosystème Omni s’écrit, se propose, se relit et s’entretient ; comment une entreprise déclare la politique d’usage de son API ; les familles et les fournisseurs recherchés.'
  lead: 'Aucune équipe ne suit seule toutes les API. Chaque fournisseur est un petit paquet à part, sous le contrat d’une famille ; il vit mieux avec un mainteneur nommé, et avec l’entreprise qui tient l’API pour le relire.'
