compat:
  eyebrow: Compatibilité
  title: 'N’importe quel cadre : les familles en PHP nu, le cœur par ses ponts'
  lead: Ce qui est vrai aujourd’hui. Aucune date n’est promise pour le reste.
  now: Aujourd’hui
  later: Ensuite
  families_title: Les familles tournent en PHP nu
  families_text: 'Le cœur d’une famille <code>omni*</code> ne requiert ni Symfony, ni Doctrine, ni Twig : seulement des bibliothèques autonomes. Son registre se monte à la main, dans un script, une application Laravel ou Symfony. Le pont Symfony est dans le paquet, sous <code>Bridge/Symfony</code>, et rien n’en est chargé ailleurs.'
  families_proof: 'La preuve : chaque famille a un test sans cadre (<code>Tests/BareTest.php</code>) qui monte son registre à la main et vérifie qu’aucune classe d’un cadre n’est chargée.'
  omnibase_title: omnibase 4 tourne par ses ponts
  omnibase_text: '<code>omnisense/omnibase</code> 4.x ne requiert que sa fondation, sans cadre : Symfony vient par <code>omnibridge/symfony</code>, Laravel par <code>omnibridge/laravel</code>, le stockage et le rendu par <code>omnibridge/doctrine</code> et <code>omnibridge/twig</code>.'
  agnostic_title: Les structures préparées suivent
  agnostic_text: 'Les structures préparées <code>omnibase/*</code> sont aujourd’hui des bundles Symfony sur le cœur ; chacune passe son métier à la racine de son paquet (objets, règles, contrats) quand elle est reprise, ses parts de cadre dans des ponts. La colle générique, qui ne connaît aucune structure :'
  bridge_symfony: conteneur, routage, formulaires, sécurité
  bridge_doctrine: le stockage (Doctrine est autonome)
  bridge_twig: le rendu (Twig est autonome)
  bridge_composer: 'l’installation : les stubs et les retouches déclarées du cœur'
  bridge_laravel: les contrats du cœur sur le conteneur de Laravel
