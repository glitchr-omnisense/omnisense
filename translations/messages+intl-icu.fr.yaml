compat:
  eyebrow: "Compatibilité"
  title: "Compatible avec n’importe quel cadre — aujourd’hui les familles, demain le socle"
  lead: "Ce qui est vrai aujourd’hui, et ce qui le sera. Sans date : le chantier du socle vient après les sites en cours."
  now: "Aujourd’hui"
  later: "Prévu"
  families_title: "Les familles tournent en PHP nu"
  families_text: "Le cœur d’une famille <code>omni*</code> ne requiert ni Symfony, ni Doctrine, ni Twig : seulement des bibliothèques autonomes. Son registre se monte à la main, dans un script, une application Laravel ou Symfony. Le pont Symfony est dans le paquet, sous <code>Bridge/Symfony</code>, et rien n’en est chargé ailleurs."
  families_proof: "La preuve : chaque famille a un test sans cadre (<code>Tests/BareTest.php</code>) qui monte son registre à la main et vérifie qu’aucune classe d’un cadre n’est chargée."
  omnibase_title: "omnibase est fait pour Symfony"
  omnibase_text: "<code>glitchr/omnibase</code> et ses composants <code>omnibase/*</code> sont aujourd’hui des bundles Symfony : leurs écrans, leur stockage et leurs gabarits s’appuient sur Symfony, Doctrine et Twig."
  agnostic_title: "omnibase deviendra agnostique"
  agnostic_text: "Le métier de chaque composant passera à la racine de son paquet (objets, règles, contrats), ses parts de cadre dans des ponts du même paquet (<code>Bridge/Symfony</code>, <code>Bridge/Doctrine</code>, <code>Bridge/Twig</code>). Une colle générique, qui ne connaît aucun composant, les reliera à chaque cadre :"
  bridge_symfony: "conteneur, routage, formulaires, sécurité"
  bridge_doctrine: "le stockage (Doctrine est autonome)"
  bridge_twig: "le rendu (Twig est autonome)"
  bridge_composer: "l’installation, aujourd’hui glitchr/base-plugin"
  bridge_laravel: "quand quelqu’un s’en servira"
  read_more: "Le détail, et ce qu’il impose à chaque paquet : <a href=\"{url}\">la page Compatibilité de la documentation</a>."
  bridges_below: "Cette colle, c’est <a href=\"{url}\">omnibridge</a>, décrit plus haut."

