  title: "Quatre étages, deux bâtiments"
  lead: "À gauche, ce dont un site est fait. À droite, ce qu’il demande au dehors. Les deux ne se doivent rien : une famille sert aussi sans le socle."
  stack_house: "Ce dont un site est fait"
  stack_outside: "Ce qu’un site demande au dehors"
  packages: "{count, plural, one {paquet} other {paquets}}"
  note: "Un site prend le socle, les métiers dont il a besoin, et les familles que ces métiers interrogent."
