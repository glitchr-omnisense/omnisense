floors:
  eyebrow: "Le socle"
  title: "Le cœur, les familles, les ponts"
  lead: "Ce que tout site peut prendre : omnibase, le cœur des sites ; les familles, un contrat par domaine, que leurs fournisseurs remplissent service par service ; les ponts, qui relient le tout à un cadre. Les fournisseurs ne sont pas listés ici : ils se cherchent."
  packages: "{count, plural, one {paquet} other {paquets}}"
  note: "Un site prend le socle, les familles qu’il appelle et les ponts de son cadre. Les structures préparées s’ajoutent si elles font gagner du temps : rien dans le socle ni dans les familles n’en dépend."
  libraries: "S’y ajoutent <a href=\"{url}\">{count, plural, one {# bibliothèque JavaScript} other {# bibliothèques JavaScript}}</a>."
  foundation:
    name: "Cœur"
    one: "Cœur"
    pattern: "glitchr/omnibase"
    text: "Le cœur dont tout site part : comptes et sécurité, back-office, traductions, images, formulaires."
  component:
    name: "Structures préparées"
    one: "Structure préparée"
    pattern: "omnibase/<métier>"
    text: "Une structure toute prête pour un métier — entités, écrans, back-office, traductions, données de démonstration — déjà assemblée sur le socle. Facultative : la prendre pour aller vite, ou écrire la sienne sur le socle et les familles."
  family:
    name: "Familles"
    one: "Famille"
    pattern: "omniscient/omni<domaine>"
    text: "Le contrat d’un domaine - colis, paiements, registres publics, données scientifiques - en PHP nu, quel que soit le service derrière. Sous omniscient/, ou encore glitchr/ pour celles qui n’ont pas déménagé."
  provider:
    name: "Fournisseurs"
    one: "Fournisseur"
    pattern: "omni<domaine>/<service>"
    text: "Un service qui remplit le contrat de sa famille : un paquet par service, à installer seul."
  bridge:
    name: "Ponts"
    one: "Pont"
    pattern: "omnibridge/<cible>"
    text: "La colle entre le socle et un cadre, un stockage ou une couche de rendu. Il ne connaît aucune structure : un pont les sert toutes."
  library:
    name: "Bibliothèques"
    one: "Bibliothèque"
    pattern: "@glitchr/<nom>"
    text: "Les bibliothèques JavaScript de la maison, sans dépendance."
  providers_count: "{count, plural, =0 {aucun fournisseur} one {# fournisseur à chercher} other {# fournisseurs à chercher}}"

families:
  omnibase:
    phrase: "Le cœur des sites, et des structures toutes prêtes, facultatives."
    text: "glitchr/omnibase est fait pour Symfony : comptes et sécurité, back-office, traductions, images, formulaires. Les structures préparées omnibase/<métier> y assemblent un métier d’avance ; elles sont facultatives : rien dans le socle ni dans les familles n’en dépend."
  omnibus:
    phrase: "Expédier un colis, quel que soit le transporteur."
    text: "Un seul contrat pour les transporteurs : tarifs, étiquettes, suivi, points relais."
  omnitrade:
    phrase: "Encaisser et vendre, quel que soit le prestataire."
    text: "Un seul contrat pour les prestataires de paiement et les plateformes de commerce : achat, autorisation, capture, remboursement, webhooks, commandes des plateformes."
  omnistate:
    phrase: "Demander aux registres publics ce qu’ils savent."
    text: "Un seul contrat pour ce que savent les États et les registres : entreprises, numéros de TVA, noms de domaine et réseaux, et les registres que ses fournisseurs ajoutent."
  omnibank:
    phrase: "Lire un compte en banque."
    text: "Un seul contrat pour l’accès bancaire : comptes, soldes, écritures, virements, consentements et webhooks, depuis des relevés en fichiers ou les interfaces des banques."
  omnisong:
    phrase: "Faire écouter le catalogue d’un musicien."
    text: "Un seul contrat pour écouter un catalogue : disques, plages, extraits, les liens vers chaque plateforme, et les lecteurs qui les jouent."
  omnipost:
    phrase: "Publier sur les réseaux sociaux."
    text: "Un seul contrat pour publier — un reel, une photo, un carrousel —, lire son propre fil, et connaître ce que chaque réseau impose."
  omnifood:
    phrase: "Recevoir les commandes et les réservations d’un restaurant."
    text: "Un seul contrat pour les plateformes de restauration : commandes en livraison, réservations de table, cartes, établissements, webhooks."
  omnischolar:
    phrase: "Rassembler les publications d’un chercheur."
    text: "Un seul contrat pour les publications : profils d’auteur, travaux, livres et leurs éditions, citations, lus dans plusieurs bases, fusionnés et dédoublonnés, exportés en BibTeX, RIS ou CSL-JSON."
  omnilab:
    phrase: "Lire ce que la science sait d’une chose, ou mesure en un lieu."
    text: "Un seul contrat pour les API scientifiques publiques, quel que soit le domaine : une entité (un composé, une réaction, une structure cristalline, un matériau, une constante physique, un gène, une protéine et ses domaines, une structure de protéine, une voie biologique, une maladie, un variant génétique, une espèce, un astre, une galaxie, une exoplanète, un astéroïde ou une comète, un séisme, une éruption solaire, un lancement de fusée) avec ses propriétés, leurs unités et ses identifiants dans d’autres bases, suivis d’une base à l’autre ; une série (une variable mesurée en un lieu, ou à une station météo, hydrométrique ou marégraphique, sur une période : météo, climat, air, rivières, marées ; la course d’une planète ou d’une comète dans le ciel de ce lieu) ; les occurrences d’un lieu et d’une période (les relevés et observations d’une espèce, les séismes d’une région, les lancements d’un mois) ; un produit catalogué (une scène satellite ; un jeu de données ou la table d’un catalogue astronomique, trouvés par texte ; le fichier d’une demande, suivie jusqu’à ce qu’il soit prêt ; au sens de STAC). Ses sources, par domaine — chimie : PubChem, ChEBI, ChEMBL, KEGG (usage académique), les réactions biochimiques de Rhea, le résolveur d’identifiants chimiques du NCI/CADD (avec OPSIN pour les noms systématiques) ; cristaux et matériaux : la Crystallography Open Database, le Materials Project, l’OQMD ; physique : les constantes fondamentales du CODATA (NIST) ; gènes, protéines et maladies : UniProt, NCBI Gene, HGNC, Ensembl (avec les plantes, champignons et invertébrés d’Ensembl Genomes), RCSB PDB, InterPro et Pfam, la Gene Ontology (QuickGO), les interactions de protéines de STRING, Reactome, les cibles, maladies et médicaments d’Open Targets, ClinVar, le GWAS Catalog ; le vivant : NCBI Taxonomy, le Catalogue of Life (sur lequel GBIF bâtit sa taxonomie), GBIF, ITIS, iNaturalist, eBird (les oiseaux ; une clé au-delà de sa taxonomie), la Liste rouge de l'UICN (avec un jeton) ; la mer : OBIS et le World Register of Marine Species (WoRMS) ; les fossiles : la Paleobiology Database ; le ciel : SIMBAD, NED (galaxies et quasars), les catalogues VizieR du CDS, le catalogue Gaia DR3 de l’ESA, l’archive des exoplanètes de la NASA ; le système solaire : la base des petits corps du JPL, le Minor Planet Center, les éphémérides de JPL Horizons ; la Terre : les catalogues des séismes de l’USGS et de l’EMSC, Open-Meteo, la NOAA (les relevés des stations du NCEI, le National Weather Service), le Deutscher Wetterdienst (par Bright Sky), le Copernicus Data Space, les entrepôts de données climat et atmosphère de Copernicus (C3S, CAMS), NASA Earthdata, les altitudes (Open Topo Data) ; l’eau : les rivières et les puits de l’USGS, les marées et niveaux d’eau de la NOAA (CO-OPS) ; l’air : les mesures d’OpenAQ (avec une clé) ; la météo de l’espace : le Space Weather Prediction Center de la NOAA (les aurores, l’indice Kp, le vent solaire), les événements DONKI de la NASA (éruptions, éjections de masse coronale, tempêtes) ; le spatial : les lancements de Launch Library 2 ; et Wikidata pour tous."
  omnilex:
    phrase: "Lire les sources du droit."
    text: "Un seul contrat pour les sources du droit : textes, codes et jurisprudence, cherchés avec des filtres, lus dans leur version en vigueur à une date ; identifiants normalisés et validés (ECLI, NOR, CELEX)."
  omnimeet:
    phrase: "Ouvrir une salle de visio et y faire entrer quelqu’un."
    text: "Un seul contrat pour la visioconférence : ouvrir une salle, y faire entrer un participant, la fermer, lire son état — que l’appel passe de navigateur à navigateur ou par un service de conférence."
  omnishield:
    phrase: "Garder un formulaire : captcha, pourriel, adresses connues pour abus."
    text: "Un seul contrat pour garder un formulaire : ce jeton est-il valable (ALTCHA, Turnstile, reCAPTCHA), ce texte est-il un pourriel (Akismet), cette adresse est-elle connue pour abus (StopForumSpam, domaines jetables) — quel que soit celui qui répond ; un champ de formulaire et une contrainte côté Symfony."
  omnishow:
    phrase: "Jouer une vidéo hébergée ailleurs."
  omnisign:
    phrase: "Faire signer un document."
    text: "Un seul contrat pour faire signer : créer une enveloppe (documents, signataires, champs, niveau simple, avancé ou qualifié), l’envoyer, la suivre, relancer, annuler, signer dans la page, télécharger les documents signés et leurs preuves — Yousign, DocuSign, DocuSeal."
  omnibill:
    phrase: "Transmettre et recevoir une facture électronique."
    text: "Un seul contrat pour la facture électronique : déposer un fichier conforme (Factur-X, UBL, CII), suivre ses statuts, recevoir les factures des fournisseurs, déclarer un statut, chercher une entreprise dans l’annuaire, transmettre l’e-reporting — par courriel, une plateforme agréée (XP Z12-013) ou Chorus Pro."
  omnireview:
    phrase: "Lire ce que les clients disent ailleurs."
    text: "Un seul contrat pour ce que les clients disent ailleurs : la note, les avis, la réponse de l’établissement, l’invitation à laisser un avis — Google, Tripadvisor, Trustpilot —, chaque plateforme avec ses conditions d’affichage ; l’origine, la date et le lien toujours montrés."
  omniticket:
    phrase: "Lire les billets vendus ailleurs."
  omnireach:
    phrase: "Lire ce que les outils extérieurs savent de l’audience d’un site."
  omnifilm:
    phrase: "Décrire une œuvre : film, série, épisode."
  omnigame:
    phrase: "Suivre un jeu sur les boutiques."
  omnidns:
    phrase: "Gérer un nom de domaine là où il est enregistré."

