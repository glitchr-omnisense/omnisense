floors:
  eyebrow: "Les paquets"
  title: "omnibase et les familles, côte à côte"
  lead: "À gauche, omnibase : un socle, et des extensions qui ajoutent ce dont un site a besoin. À droite, les familles : un contrat par domaine, et un paquet par service qui le remplit. Aucun n’a besoin de l’autre, et aucun n’est lié à un cadre : c’est le travail d’omnibridge, juste en dessous."
  stack_house: "omnibase : le socle et ses extensions"
  stack_outside: "Les familles : un contrat et ses services"
  packages: "{count, plural, one {paquet} other {paquets}}"
  note: "Un site prend le socle, les extensions dont il a besoin, les familles que ces extensions appellent, et les ponts de son cadre."
  libraries: "S’y ajoutent <a href=\"{url}\">{count, plural, one {# bibliothèque JavaScript} other {# bibliothèques JavaScript}}</a>."
  foundation:
    name: "Socle"
    one: "Socle"
    pattern: "glitchr/omnibase"
    text: "Le cœur dont tout site part : comptes et sécurité, back-office, traductions, images, formulaires."
  component:
    name: "Extensions"
    one: "Extension"
    pattern: "omnibase/<extension>"
    text: "Une extension du socle, agnostique : n’importe quel cadre lui donne vie par omnibridge."
  family:
    name: "Familles"
    one: "Famille"
    pattern: "glitchr/omni<domaine>"
    text: "Le contrat d’un domaine - colis, paiements, registres publics, données scientifiques - en PHP nu, quel que soit le service derrière."
  provider:
