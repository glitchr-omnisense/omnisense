floors:
  eyebrow: Le socle
  title: Le cœur, les familles, les ponts
  lead: 'Ce que tout site peut prendre : omnibase, le cœur des sites ; les familles, un contrat par domaine, que leurs fournisseurs remplissent service par service ; les ponts, qui relient le tout à un cadre. Les fournisseurs ne sont pas listés ici : ils se cherchent.'
  packages: '{count, plural, one {paquet} other {paquets}}'
  note: 'Un site prend le socle, les familles qu’il appelle et les ponts de son cadre. Les structures préparées s’ajoutent si elles font gagner du temps : rien dans le socle ni dans les familles n’en dépend.'
  libraries: S’y ajoutent <a href="{url}">{count, plural, one {# bibliothèque JavaScript} other {# bibliothèques JavaScript}}</a>.
  foundation:
    name: Cœur
    one: Cœur
    pattern: omnisense/omnibase
    text: 'Le cœur dont tout site part : comptes et sécurité, back-office, traductions, images, formulaires. À côté, les contrats sur lesquels s’appuie chaque famille.'
  component:
    name: Structures préparées
    one: Structure préparée
    pattern: omnibase/<métier>
    text: 'Une structure toute prête pour un métier — entités, écrans, back-office, traductions, données de démonstration — déjà assemblée sur le socle. Facultative : la prendre pour aller vite, ou écrire la sienne sur le socle et les familles.'
  family:
    name: Familles
    one: Famille
    pattern: omnisense/omni<domaine>
    text: Le contrat d’un domaine - colis, paiements, registres publics, données scientifiques - en PHP nu, quel que soit le service derrière. Sous omnisense/, ou encore glitchr/ pour celles qui n’ont pas déménagé.
  provider:
    name: Fournisseurs
    one: Fournisseur
    pattern: omni<domaine>/<service>
    text: 'Un service qui remplit le contrat de sa famille : un paquet par service, à installer seul.'
  bridge:
    name: Ponts
    one: Pont
    pattern: omnibridge/<cible>
    text: 'La colle entre le socle et un cadre, un stockage ou une couche de rendu. Il ne connaît aucune structure : un pont les sert toutes.'
  library:
    name: Bibliothèques
    one: Bibliothèque
    pattern: '@glitchr/<nom>'
    text: Les bibliothèques JavaScript de la maison, sans dépendance.
