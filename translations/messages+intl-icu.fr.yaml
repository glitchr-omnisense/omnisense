    text: "Ce dont tout site part : comptes, back-office, traductions, images, formulaires. Fait pour Symfony."
  component:
    name: "Métiers"
    one: "Métier"
    pattern: "omnibase/<métier>"
    text: "Un composant de site par métier : boutique, blog, agenda, cabinet, restaurant. Il pose ses pages et ses écrans sur le socle."
  family:
    name: "Familles"
    one: "Famille"
    pattern: "glitchr/omni<question>"
    text: "Une question posée à plusieurs services, un seul contrat pour la réponse. Sans cadre : du PHP nu, Symfony en option."
  provider:
    name: "Fournisseurs"
    one: "Fournisseur"
    pattern: "omni<question>/<service>"
    text: "Un service qui répond à la question : un paquet par service, à installer seul."
