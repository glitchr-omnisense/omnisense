# The website: built statically by omnibridge/static, published on GitHub Pages.
#
#   pull request         tests, the whole site built, uploaded as an artifact: the preview
#                        (nothing is published)
#   main                 the same, plus a --full export into an empty folder compared with the
#                        incremental one (byte for byte), smoke tests in headless Chrome over a
#                        static server that serves it as GitHub Pages does (under the base path),
#                        the sitemap, the search indexes and the feeds checked, the deployment
#                        manifest written (provenance.json) - then deployed to GitHub Pages, the
#                        folder kept 90 days as the run's `site` artifact
#   workflow_dispatch    the same; `full` renders every page; `rollback: <run id | commit>` builds
#                        nothing and deploys again the `site` artifact of that earlier run of main
#                        (or of the latest one built from that commit) - see the rollback job
#   repository_dispatch  `documentation-published` from a package (master plan section 10, items
#                        11 and 12): its manual moved to the commit it names, then a targeted
#                        rebuild of that manual's pages - see the Dispatch step;
#                        `package-released`: the catalogue imported again from every package's
#                        repository and Packagist, built and tested, and proposed as a pull request
#                        (nothing deployed) - see the catalogue jobs
#
# Incremental: var/static-cache (the renderer's answers, by the fingerprint of the inputs
# static.php declares, and omnibridge/static's build record) is kept from one run to the next;
# a page whose inputs did not change is not rendered again, a page without declared inputs is
# rendered every time, a change of the shared renderer (src, templates, config, the lock...)
# renders everything, and so does a cache whose record cannot be trusted (none, another
# omnibridge/static, another PHP or extension, a PHP file the last export loaded that changed).
#
# The site's address: the repository variable SITE_URL when a custom domain is set
# (https://example.org/), otherwise the address GitHub Pages gives the repository
# (actions/configure-pages: https://glitchr-omnisense.github.io/omnisense), otherwise
# https://glitchr-omnisense.github.io/omnisense/. The pages are rendered at the root and
# omnibridge/static moves every internal address under its folder (/omnisense), and
# fails the build on any left outside it.
#
# Settings → Pages → Source: GitHub Actions, once, before the first deployment.
name: website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Render every page (--full), nothing taken from the cache
        type: boolean
        default: false
      rollback:
        description: 'Deploy again the site an earlier run of main built: its run id (the number in the run''s address), or the full SHA of the commit it was built from. Nothing is built.'
        type: string
        default: ''
  # documentation-published: a documentation package published a commit,
  #   {"key": "<its manual>", "commit": "<sha>", "series": "<optional>"}.
  # package-released: a package published a release, {"package": "<vendor/name>", "version": "<tag>",
  #   "repository": "<owner/name>"} - the catalogue imported again, proposed as a pull request.
  repository_dispatch:
    types: [documentation-published, package-released]

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No session, no form, no signed value on a static site: the kernel only needs one to boot.
  APP_SECRET: static-site-build-not-a-secret

jobs:
  # package-released: the catalogue imported again, as a maintainer imports it (app:catalog:import) but from
  # shallow clones of every repository the catalogue lists and of the released one (app:catalog:clone; one that
  # does not clone stops it: a partial set would drop packages), with each package's release read from
  # Packagist. Read-only: the changed files go to the build as an artifact, and the pull request job proposes
  # them. Nothing changed: nothing built, nothing proposed. The payload is read through the environment.
  catalogue:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'package-released'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.import.outputs.changed }}
      branch: ${{ steps.import.outputs.branch }}
      title: ${{ steps.import.outputs.title }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, exif, ftp, gd, iconv, igbinary, imagick, intl, mbstring, pdo_sqlite, sodium, sqlite3, xml, xsl, zip
          ini-values: memory_limit=2G
          coverage: none
          tools: composer:v2

      - name: Composer cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Import
        id: import
        env:
          PACKAGE: ${{ github.event.client_payload.package }}
          VERSION: ${{ github.event.client_payload.version }}
          REPOSITORY: ${{ github.event.client_payload.repository }}
        run: |
          [[ "$PACKAGE" =~ ^@?[a-z0-9][a-z0-9_.-]*/[a-z0-9][a-z0-9_.-]*$ ]] || { echo "::error::package-released names no package (vendor/name): \"$PACKAGE\"."; exit 1; }
          [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.+-]*)?$ ]] || { echo "::error::package-released names no version (1.2.3): \"$VERSION\"."; exit 1; }
          [ -z "$REPOSITORY" ] || [[ "$REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || { echo "::error::package-released: \"$REPOSITORY\" is no repository (owner/name)."; exit 1; }
          # Packagist lists a release minutes after its tag: waited for, up to 10 minutes (a Composer package).
          if [[ "$PACKAGE" != @* ]]; then
            for _ in $(seq 1 20); do
              curl -fsS "https://repo.packagist.org/p2/$PACKAGE.json" | jq -e --arg v "${VERSION#v}" --arg p "$PACKAGE" '.packages[$p][] | select((.version | ltrimstr("v")) == $v)' >/dev/null && break
              sleep 30
            done || true
          fi
          php bin/console app:catalog:clone "$RUNNER_TEMP/repos" ${REPOSITORY:+--repository="$REPOSITORY"} --no-interaction
          OMNI_REPOS="$RUNNER_TEMP/repos" php bin/console app:catalog:import --no-interaction
          slug=$(printf '%s-%s' "${PACKAGE#@}" "${VERSION#v}" | tr '/' '-')
          echo "branch=catalogue/$slug" >> "$GITHUB_OUTPUT"
          echo "title=The catalogue after $PACKAGE $VERSION (package-released)" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain -- catalog config/documentation.yaml)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The catalogue already says what the repositories and Packagist say: nothing to propose." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- catalog config/documentation.yaml
            git diff --stat -- catalog config/documentation.yaml
          fi

      - name: Keep the catalogue
        if: steps.import.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalogue
          path: |
            catalog
            config/documentation.yaml
          retention-days: 7

  build:
    needs: catalogue
    # Every event but a rollback; after a package-released import, only when it changed something.
    if: >-
      !cancelled() && needs.catalogue.result != 'failure' && needs.catalogue.outputs.changed != 'false'
      && (github.event_name != 'workflow_dispatch' || inputs.rollback == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # actions/configure-pages reads the repository's Pages site (its address).
      pages: read
    outputs:
      moved: ${{ steps.dispatch.outputs.moved }}
      pin: ${{ steps.dispatch.outputs.pin }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # package-released: the catalogue the import wrote, over the checkout - the site built and tested is the
      # one the pull request proposes.
      - name: The imported catalogue
        if: needs.catalogue.outputs.changed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalogue
          path: .

      # The address GitHub Pages serves the site at (main only: a pull request publishes nothing).
      - name: GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The static site's public address (canonical links, sitemap, feeds): a custom domain's
      # SITE_URL, else the Pages address, else the default project site's.
      - name: Site address
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          site_url="${CUSTOM_SITE_URL:-${PAGES_URL:-https://glitchr-omnisense.github.io/omnisense/}}"
          base_path=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.urlparse(sys.argv[1]).path.rstrip("/"))' "$site_url")
          echo "SITE_URL=$site_url" >> "$GITHUB_ENV"
          echo "BASE_PATH=$base_path" >> "$GITHUB_ENV"
          echo "The site: $site_url (base path: ${base_path:-/})"

      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, exif, ftp, gd, iconv, igbinary, imagick, intl, mbstring, pdo_sqlite, sodium, sqlite3, xml, xsl, zip
          ini-values: memory_limit=2G
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: yarn

      - name: Composer cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          yarn install --frozen-lockfile

      - name: Validate
        run: |
          composer validate --no-check-publish
          php bin/console lint:container
          php bin/console lint:twig templates
          php bin/console lint:yaml config catalog translations --parse-tags

      - name: Tests
        run: php vendor/bin/phpunit

      # documentation-published: the package's manual moved to the commit it names (its series'
      # branch head without one), checked to be on that branch of the repository
      # config/documentation.yaml names (app:docs:pin), then only that manual's addresses rendered
      # whatever the cache holds (--only); every other page goes through the ordinary rule. A key
      # the site does not know (or none) builds the whole site as a push does. The payload is
      # read through the environment, never written into the script.
      - name: Dispatch
        id: dispatch
        if: github.event_name == 'repository_dispatch' && github.event.action == 'documentation-published'
        env:
          KEY: ${{ github.event.client_payload.key }}
          COMMIT: ${{ github.event.client_payload.commit }}
          SERIES: ${{ github.event.client_payload.series }}
        run: |
          request=$(jq -nc --arg key "$KEY" --arg commit "$COMMIT" --arg series "$SERIES" \
            '{type: "documentation-published", key: $key, commit: (if $commit == "" then null else $commit end), series: (if $series == "" then null else $series end)}')
          echo "request=$request" >> "$GITHUB_OUTPUT"
          if ! [[ "$KEY" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::warning::documentation-published without a manual's key: the whole site is built."
            exit 0
          fi
          status=0
          php bin/console app:docs:pin "$KEY" ${COMMIT:+"$COMMIT"} ${SERIES:+--series="$SERIES"} --no-interaction || status=$?
          case $status in
            0)
              echo "only=/docs/$KEY,/docs/$KEY/*,/fr/docs/$KEY,/fr/docs/$KEY/*" >> "$GITHUB_OUTPUT"
              if git diff --quiet -- config/documentation.yaml; then
                echo "moved=false" >> "$GITHUB_OUTPUT"
              else
                echo "moved=true" >> "$GITHUB_OUTPUT"
                echo "pin=$(git diff -U0 -- config/documentation.yaml | grep '^+ *ref:' | tr -s ' ' | sed 's/^+ ref: //')" >> "$GITHUB_OUTPUT"
                git diff -- config/documentation.yaml
              fi ;;
            2) echo "::warning::The site has no manual \"$KEY\": the whole site is built." ;;
            *) exit "$status" ;;
          esac

      # Each package's docs/ at the commit config/documentation.yaml pins: a ref never
      # changes, so what was fetched is kept from one run to the next.
      - name: Documentation cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: var/docs
          key: docs-v2-${{ hashFiles('config/documentation.yaml') }}
          restore-keys: docs-v2-

      # The renderer's answers of the last run (saved under this run's key once the job succeeds;
      # a failed build leaves the last good cache as it was). The prefix's generation (v2) is raised to
      # start from nothing: v2 after the 2026-11-13 history rewrites of the documented repositories, so
      # that no page rendered before them is reused. A cache without omnibridge/static 1.1's build record (or
      # with one it cannot trust) renders everything once and writes the record: no generation to raise for it.
      - name: Static export cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: var/static-cache
          key: static-cache-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: static-cache-v2-

      # The compatibility dashboard's data, from GitHub's Actions API with the job's token. A failure
      # (a rate limit) keeps config/compatibility.yaml as committed: the build never depends on it.
      - name: Compatibility data
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: php bin/console app:compat:fetch --no-interaction

      # The header's star count, from GitHub's REST API with the job's token. A failure keeps
      # config/github.yaml as committed; a page without a count shows the button alone.
      - name: Star count
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: php bin/console app:stars:fetch --no-interaction

      # The usage policies the providers' packages declare: each one's policy.json at its published head
      # (git ls-remote, then raw.githubusercontent.com at that commit), checked by omnisense/contracts' export
      # against the schema, into config/policies.json. A policy that does not validate fails here, and the
      # build would fail on it too (App\Catalogue\Api\DeclaredPolicies); a package GitHub did not answer
      # for keeps its committed entry.
      - name: Usage policies
        run: php bin/console app:policies:import --no-interaction

      # For GitHub Pages: .nojekyll, the redirections as pages, every address under BASE_PATH.
      # Incremental from the cache restored above; its last line (incremental, or full and why, and the
      # counts) goes into the run's summary.
      - name: Build
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full && '--full' || '' }}
          ONLY: ${{ steps.dispatch.outputs.only }}
        run: |
          set -o pipefail
          bin/omnibridge-static build --out=dist --github-pages ${FULL:+"$FULL"} ${ONLY:+"--only=$ONLY"} 2>&1 | tee build.log
          echo "Export: $(grep -E '^(incremental|full)( \(|:)' build.log | tail -1)" >> "$GITHUB_STEP_SUMMARY"

      # The proof that the cache served no stale page: a --full export into an empty folder, with
      # a cache of its own, gives the same files byte for byte (and two exports agree: deterministic).
      # A dispatch's targeted rebuild skips it (the next push compares again).
      - name: A full export, the same files
        if: github.event_name != 'pull_request' && github.event_name != 'repository_dispatch'
        run: |
          bin/omnibridge-static build --out=dist-full --skip-assets --github-pages --full --cache=var/static-cache-full
          cmp dist/omnibridge-static.json dist-full/omnibridge-static.json
          diff -r dist dist-full
          rm -rf dist-full var/static-cache-full

      - name: Sitemap, search and feeds
        run: |
          python3 - <<'EOF'
          import json, xml.etree.ElementTree as ET
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9', 'x': 'http://www.w3.org/1999/xhtml'}
          urls = ET.parse('dist/sitemap.xml').getroot().findall('s:url', ns)
          alternates = sum(len(u.findall('x:link', ns)) for u in urls)
          assert len(urls) > 500 and alternates > 0, (len(urls), alternates)
          for index in ('dist/search.json', 'dist/fr/search.json'):
              entries = json.load(open(index))['entries']
              kinds = {e['k'] for e in entries}
              assert {'guide', 'news', 'doc', 'family', 'provider'} <= kinds, (index, kinds)
          for feed in ('dist/news/feed.atom', 'dist/news/feed.rss', 'dist/fr/actualites/feed.atom', 'dist/fr/actualites/feed.rss'):
              ET.parse(feed)
          manifest = json.load(open('dist/omnibridge-static.json'))
          errors = [d for d in manifest['diagnostics'] if d['level'] != 'notice']
          assert not errors, errors
          print(f"{len(urls)} addresses in the sitemap ({alternates} language alternates), {len(manifest['pages'])} pages, {len(manifest['files'])} files")
          EOF

      # Served as GitHub Pages serves it: under BASE_PATH, a folder redirected to its address
      # with a slash, 404.html for the rest; no request nor link outside BASE_PATH.
      - name: Smoke tests in headless Chrome
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name static -p 8135:80 -e BASE_PATH="$BASE_PATH" -v "$PWD/dist:/srv/www$BASE_PATH:ro" -v "$PWD/tests/smoke/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro" nginx:1.27-alpine
          for _ in $(seq 1 30); do curl -fs "http://localhost:8135$BASE_PATH/" >/dev/null && break; sleep 1; done
          node tests/smoke/chrome.mjs "http://localhost:8135$BASE_PATH" smoke-shots

      # The deployment manifest, published with the site (master plan section 10, item 10): the
      # site's commit and the files this run changed in the checkout (the data fetched above, a
      # moved pin), the commit each documentation source was read at, the packages and tools that
      # rendered it, the checksums. Deterministic: no time nor run in it (two builds from the same
      # sources write the same file); what asked for the build goes to the run's summary. Written
      # last: not one of the files the export lists and the comparison above checks.
      - name: Provenance
        env:
          DISPATCH_REQUEST: ${{ steps.dispatch.outputs.request }}
          PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || '' }}
          INPUTS: ${{ github.event_name == 'workflow_dispatch' && toJSON(inputs) || '' }}
          EVENT: ${{ github.event.action || github.event_name }}
        run: |
          php bin/console app:provenance dist
          request="${DISPATCH_REQUEST:-${PAYLOAD:-$INPUTS}}"
          {
            echo "Provenance: \`provenance.json\` $(sha256sum dist/provenance.json | cut -d' ' -f1)"
            [ -z "$request" ] || echo "Request ($EVENT): \`$(jq -c . <<< "$request")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the preview
        if: github.event_name == 'pull_request' || github.event.action == 'package-released'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'catalogue' }}
          path: dist
          retention-days: 14

      # The immutable artifact a rollback deploys again (workflow_dispatch, rollback: this run's id).
      - name: Keep the site for a rollback
        if: github.event_name != 'pull_request' && github.event.action != 'package-released'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: dist
          include-hidden-files: true
          retention-days: 90

      # .nojekyll is a hidden file: included.
      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.event.action != 'package-released'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true

      # A dispatch that moved a pin: the file the pin job commits to main.
      - name: Keep the moved pin
        if: steps.dispatch.outputs.moved == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-pin
          path: config/documentation.yaml
          retention-days: 7

      - name: Upload the smoke tests' screenshots
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-shots-${{ github.sha }}
          path: smoke-shots
          if-no-files-found: ignore

  # The pin a dispatch moved, committed to main before the site that reads it is deployed: the
  # repository stays what the site is built from (the next push builds the same manual). On a main
  # that moved meanwhile, the push is refused and nothing is deployed: the package dispatches again.
  pin:
    needs: build
    if: github.event_name == 'repository_dispatch' && needs.build.outputs.moved == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: documentation-pin
          path: config
      - name: Commit the pin
        env:
          KEY: ${{ github.event.client_payload.key }}
          PIN: ${{ needs.build.outputs.pin }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/documentation.yaml
          git commit -m "config/documentation.yaml: the $KEY manual at $PIN (documentation-published)"
          git push origin "HEAD:refs/heads/main"

  # package-released: the imported catalogue, built and tested above, proposed as a pull request from a branch
  # of its own (catalogue/<package>-<version>, pushed again by a later dispatch of the same release). Never
  # pushed to main: the import writes what third-party metadata (the repositories' composer.json and READMEs,
  # Packagist) says onto public pages, so a maintainer reads it before it is published - merging it is the
  # push that deploys it. A pull request opened with the job's token starts no workflow: the build above is its
  # check (its run and preview are linked in the description). Without "Allow GitHub Actions to create and
  # approve pull requests" (Settings -> Actions -> General), the branch is pushed and the run's summary gives
  # the address that opens the pull request.
  catalogue-pr:
    needs: [catalogue, build]
    if: >-
      github.event_name == 'repository_dispatch' && github.event.action == 'package-released'
      && needs.catalogue.outputs.changed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalogue
          path: .
      - name: The pull request
        env:
          BRANCH: ${{ needs.catalogue.outputs.branch }}
          TITLE: ${{ needs.catalogue.outputs.title }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$BRANCH"
          git add -- catalog config/documentation.yaml
          git commit --quiet -m "$TITLE"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "app:catalog:import over every repository of the catalogue and the released one, with Packagist's releases, after a \`package-released\` dispatch." \
            "$(git show --stat --format= HEAD)" \
            "Built, tested and smoke-tested by $run (its \`website-catalogue\` artifact is the preview). Merging deploys it.")
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "$TITLE" --body "$body"
          elif ! gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$body"; then
            echo "::warning::The pull request could not be opened with the job's token: open it from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH"
            echo "Open the pull request: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Deploy again an earlier run's `site` artifact: a successful run of this workflow on main, named by its id
  # or by the commit it was built from (the latest such run whose artifact is kept), its files checked against
  # its omnibridge-static.json and provenance.json before they go out (.github/scripts).
  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/scripts
      - name: The run
        id: run
        env:
          ROLLBACK: ${{ inputs.rollback }}
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(.github/scripts/rollback-run.sh "$ROLLBACK")
          read -r run commit <<< "$found"
          echo "Rollback to run $run, commit $commit" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "id=$run" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: dist
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Check the files
        env:
          COMMIT: ${{ steps.run.outputs.commit }}
        run: python3 .github/scripts/check-site.py dist "$COMMIT"
      - name: Upload the site for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: [build, pin, rollback]
    # The build's site, or the rollback's; never after a failure (a pin refused leaves the site as it is).
    if: >-
      !cancelled() && !failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && github.event.action != 'package-released'
      && (needs.build.result == 'success' || needs.rollback.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, none cancelled half-way.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
